function openEditClientModal(clientId){
  const c = state.clients.find(x=>x.id===clientId);
  if(!c) return;
  editClientData = {id:c.id, name:c.name, phone:c.phone||'', type:c.type};
  render();
}
function setEditClientType(type){ if(editClientData){ editClientData.type = type; render(); } }
function saveEditClientData(){
  if(!editClientData) return;
  const name = document.getElementById('edit-client-name').value.trim();
  const phone = document.getElementById('edit-client-phone').value.trim();
  const type = editClientData.type;
  if(!name){ showToast('Completa el nombre'); return; }
  const c = state.clients.find(x=>x.id===editClientData.id);
  if(!c){ render(); return; }
  if(type !== c.type){
    if(type==='medico' && !c.doctorCode){ c.doctorCode = {code:genLoyaltyCode(name,'DR'), pct:state.loyaltySettings.doctorPct, usageCount:0, active:true, createdAt:Date.now()}; }
    if(type!=='medico' && c.doctorCode){ c.doctorCode = null; }
    c.type = type;
  }
  c.name = name; c.phone = phone;
  editClientData = null;
  persist(); render();
  showToast('Cliente actualizado');
}

function openClientDetailOverlay(clientId){ viewClientDetailId = clientId; render(); }
function closeClientDetailOverlay(){ viewClientDetailId = null; render(); }

function handleClientsSearch(inputEl){
  clientsSearch = inputEl.value;
  render();
  const el = document.getElementById('clients-search-input');
  if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
}

function handleRegisterClient(e){
  e.preventDefault();
  const name = document.getElementById('reg-client-name').value.trim();
  const phone = document.getElementById('reg-client-phone').value.trim();
  const type = clientsRegSelectedType || 'publico';
  if(!name){ showToast('Completa el nombre'); return false; }
  const c = addLoyaltyClient(name, phone, type);
  persist();
  registerSuccessClientId = c.id;
  render();
  return false;
}

function updateLoyaltySettingsForm(){
  const visitCount = parseInt(document.getElementById('f-visit-count').value,10)||3;
  const visitPct = parseInt(document.getElementById('f-visit-pct').value,10)||5;
  const purchaseThreshold = parseFloat(document.getElementById('f-purchase-threshold').value)||1000;
  const purchasePct = parseInt(document.getElementById('f-purchase-pct').value,10)||10;
  const doctorPct = parseInt(document.getElementById('f-doctor-pct').value,10)||5;
  state.loyaltySettings = {visitCount, visitPct, purchaseThreshold, purchasePct, doctorPct};
  persist();
  showToast('Ajustes guardados');
}

function renderLoyBlister(cycle, total){
  let dots = '';
  for(let i=0;i<total;i++){ dots += `<div class="loy-pocket ${i<cycle?'filled':''}"></div>`; }
  return `<div class="loy-blister">${dots}</div>`;
}
function renderLoyVial(accum, threshold){
  const pct = Math.min(100, (accum/threshold)*100);
  return `<div class="loy-vial"><div class="loy-vial-fill" style="width:${pct}%"></div></div><span class="loy-vial-text">${money(accum)} / ${money(threshold)}</span>`;
}

function renderLoyDoctorBox(c){
  if(!c.doctorCode){
    return `<div class="loy-doctor-box">
      <h4>Código para Pacientes</h4>
      <div class="sub">Ofrece a sus pacientes un ${state.loyaltySettings.doctorPct}% de descuento.</div>
      <button class="btn btn-outline btn-sm" style="width:100%;background:#fff;" onclick="generateDoctorCodeFor('${c.id}')">Generar código</button>
    </div>`;
  }
  const dc = c.doctorCode;
  return `<div class="loy-doctor-box">
    <h4>Código Médico ${dc.active?'':'· Inactivo'}</h4>
    <div class="sub">Otorga ${dc.pct}% OFF a pacientes.</div>
    <div class="loy-doctor-code-display">
      <div><div class="code">${dc.code}</div><div style="font-size:10.5px;color:var(--text-muted);margin-top:2px;">${dc.usageCount} uso(s)</div></div>
      <div style="display:flex;gap:6px;">
        <button class="loy-copy-btn" onclick="copyLoyaltyCode('${dc.code}')">Copiar</button>
        <button class="loy-copy-btn" style="background:#AF52DE;" onclick="registerDoctorUseFor('${c.id}')">+1 uso</button>
      </div>
    </div>
    <button class="btn btn-outline btn-sm" style="width:100%;background:#fff;margin-top:8px;" onclick="toggleDoctorActiveFor('${c.id}')">${dc.active?'Desactivar':'Reactivar'}</button>
  </div>`;
}

function renderLoyClientCard(c){
  const couponsHtml = (c.coupons||[]).map(cp=>`
    <div class="loy-ticket ${cp.source==='compra'?'compra':''} ${cp.redeemed?'redeemed':''}">
      ${cp.redeemed?'<div class="redeemed-tag">Usado</div>':''}
      <div class="code-label">Cupón · ${cp.source==='compra'?'Compras':'Visitas'}</div>
      <div class="code">${cp.code}</div>
      <div class="meta">
        <span class="pct">${cp.pct}% OFF</span>
        <div style="display:flex;gap:6px;">
          <button class="loy-copy-btn" onclick="copyLoyaltyCode('${cp.code}')">Copiar</button>
          <button class="loy-copy-btn" style="background:${cp.redeemed?'var(--text-muted)':'var(--turquoise)'}" onclick="toggleRedeemClientCoupon('${c.id}','${cp.id}')">${cp.redeemed?'Reabrir':'Usar'}</button>
        </div>
      </div>
    </div>`).join('');

  return `<div class="loy-card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
      <div>
        <div class="loy-name-row">
          <div class="loy-name" onclick="openClientDetailOverlay('${c.id}')">${escapeHtml(c.name)}</div>
          <span class="loy-type loy-type-${c.type}">${TYPE_LABELS[c.type]}</span>
        </div>
        ${c.phone ? `<div class="loy-phone">${escapeHtml(c.phone)}</div>` : ''}
      </div>
      <div style="display:flex;gap:4px;">
        <button class="loy-menu-btn" onclick="openEditClientModal('${c.id}')" title="Editar">✏️</button>
        <button class="loy-menu-btn" onclick="setConfirmDeleteClient('${c.id}')" title="Eliminar">🗑️</button>
      </div>
    </div>
    <div class="loy-progress">
      <div class="loy-progress-line"><span class="loy-plabel">Visitas (${state.loyaltySettings.visitPct}%)</span>${renderLoyBlister(c.visitCycle||0, state.loyaltySettings.visitCount)}</div>
      <div class="loy-progress-line"><span class="loy-plabel">Compras (${state.loyaltySettings.purchasePct}%)</span>${renderLoyVial(c.purchaseAccum||0, state.loyaltySettings.purchaseThreshold)}</div>
    </div>
    <div class="loy-actions">
      <button class="loy-btn loy-btn-visit" onclick="addVisitClient('${c.id}')">+ Visita</button>
      <button class="loy-btn loy-btn-purchase" onclick="openPurchaseModalClient('${c.id}')">+ Compra</button>
      ${c.phone ? `<button class="loy-btn loy-btn-wa" onclick="sendWhatsAppToClient('${c.id}')">WhatsApp</button>` : ''}
    </div>
    ${couponsHtml}
    ${c.type==='medico' ? renderLoyDoctorBox(c) : ''}
  </div>`;
}

function renderClientsSubTabs(){
  const tabs = [['clientes','Clientes'],['registrar','Registrar'],['medicos','Médicos'],['ajustes','Ajustes']];
  return `<div class="loy-subtabs">${tabs.map(t=>`<button class="${clientsSubView===t[0]?'active':''}" onclick="registerSuccessClientId=null; clientsSubView='${t[0]}'; render();">${t[1]}</button>`).join('')}</div>`;
}

function renderClientesHeader(){
  const total = state.clients.length;
  const activeCoupons = state.clients.reduce((n,c)=>n+(c.coupons||[]).filter(k=>!k.redeemed).length,0);
  const doctors = state.clients.filter(c=>c.type==='medico' && c.doctorCode).length;
  return `<div class="loy-header">
    <div class="loy-brand"><div class="mark">M</div><div class="word">MED<span>SUM</span></div></div>
    <div class="loy-tag">Programa de Fidelidad</div>
    <div class="loy-stats">
      <div class="loy-stat-pill"><div class="n">${total}</div><div class="l">Clientes</div></div>
      <div class="loy-stat-pill"><div class="n">${activeCoupons}</div><div class="l">Cupones</div></div>
      <div class="loy-stat-pill"><div class="n">${doctors}</div><div class="l">Médicos</div></div>
    </div>
  </div>`;
}

function renderClientesListView(){
  const q = clientsSearch.trim().toLowerCase();
  let filtered = state.clients.filter(c=> !q || c.name.toLowerCase().includes(q) || (c.phone||'').includes(q));
  if(clientsTypeFilter!=='todos') filtered = filtered.filter(c=>c.type===clientsTypeFilter);
  const chips = ['todos','publico','medico','clinica','farmacia'];

  return `
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <input id="clients-search-input" placeholder="Buscar por nombre o teléfono" value="${escapeAttr(clientsSearch)}" oninput="handleClientsSearch(this)" style="flex:1;"/>
    </div>
    <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;">
      ${chips.map(t=>`<div class="chip ${clientsTypeFilter===t?'active':''}" onclick="clientsTypeFilter='${t}'; render();">${t==='todos'?'Todos':TYPE_LABELS[t]}</div>`).join('')}
    </div>
    ${filtered.length ? filtered.map(renderLoyClientCard).join('') : `
      <div class="loy-empty">
        ${ICONS.clientes}
        <div class="t">${state.clients.length===0?'Sin clientes':'Sin coincidencias'}</div>
        ${q ? `<button class="btn btn-primary btn-sm" style="margin-top:14px;" onclick="clientsSubView='registrar'; registerSuccessClientId=null; render();">+ Registrar cliente</button>` : ''}
      </div>`}
  `;
}

    else {
      return `
        <div class="loy-card" style="text-align:center;">
          <div style="font-size:36px;margin-bottom:8px;">✨</div>
          <h4 style="margin:0 0 6px;font-size:16px;">${escapeHtml(c.name)}</h4>

          <div style="display:flex;flex-direction:column;gap:8px;">
            ${c.phone ? `<button class="loy-btn loy-btn-wa" onclick="sendWhatsAppToClient('${c.id}')">Enviar por WhatsApp</button>` : ''}

  return `
    <form class="loy-card" onsubmit="return handleRegisterClient(event)">

      <div class="field" style="margin-bottom:16px;"><label>Tipo de cuenta</label><div class="loy-type-select">${options}</div></div>

        <div style="text-align:right;">

function renderClientes(){
  return `
    ${renderClientesHeader()}
    ${renderClientsSubTabs()}
    ${clientsSubView==='clientes' ? renderClientesListView()
      : clientsSubView==='registrar' ? renderRegistrarClientView()
      : clientsSubView==='medicos' ? renderMedicosClientView()
      : renderAjustesClientView()}
    ${confirmDeleteClientId ? renderConfirmDeleteClientSheet() : ''}
    ${purchaseModalForClientId ? renderPurchaseClientSheet() : ''}
    ${editClientData ? renderEditClientSheet() : ''}
    ${viewClientDetailId ? renderClientDetailOverlay() : ''}
  `;
}

function renderConfirmDeleteClientSheet(){
  const c = state.clients.find(x=>x.id===confirmDeleteClientId);
  if(!c) return '';
  return `<div class="loy-sheet-overlay" onclick="if(event.target===this){confirmDeleteClientId=null; render();}">
    <div class="loy-sheet">
      <h4>¿Eliminar a ${escapeHtml(c.name)}?</h4>
      <p>Esta acción es permanente y removerá todo su avance de compras y visitas.</p>
      <div class="btns">
        <button class="btn btn-outline" onclick="confirmDeleteClientId=null; render();">Cancelar</button>
        <button class="btn btn-danger" onclick="deleteClientConfirmed('${c.id}')">Eliminar</button>
      </div>
    </div>
  </div>`;
}

function renderPurchaseClientSheet(){
  const c = state.clients.find(x=>x.id===purchaseModalForClientId);
  if(!c) return '';
  return `<div class="loy-sheet-overlay" onclick="if(event.target===this){purchaseModalForClientId=null; render();}">
    <div class="loy-sheet">
      <h4>Registrar compra</h4>
      <p>Ingresa el monto para sumar al perfil de ${escapeHtml(c.name)}.</p>

      </div>
    </div>

}

function renderEditClientSheet(){
  const ec = editClientData;
  const options = Object.keys(TYPE_LABELS).map(t=>`<div class="loy-type-opt ${ec.type===t?'selected':''}" onclick="setEditClientType('${t}')">${TYPE_LABELS[t]}</div>`).join('');
  return `<div class="loy-sheet-overlay" onclick="if(event.target===this){editClientData=null; render();}">
    <div class="loy-sheet">
      <h4>✏️ Editar cliente</h4>
      <p>Modifica los datos del cliente.</p>
      <div class="field" style="margin-bottom:12px;"><label>Nombre</label><input type="text" id="edit-client-name" value="${escapeAttr(ec.name)}"/></div>
      <div class="field" style="margin-bottom:12px;"><label>Teléfono</label><input type="tel" id="edit-client-phone" value="${escapeAttr(ec.phone)}"/></div>
      <div class="field" style="margin-bottom:16px;"><label>Tipo</label><div class="loy-type-select">${options}</div></div>
      <div class="btns">
        <button class="btn btn-outline" onclick="editClientData=null; render();">Cancelar</button>
        <button class="btn btn-primary" onclick="saveEditClientData()">Guardar</button>
      </div>
    </div>
  </div>`;
}

function renderClientDetailOverlay(){
  const c = state.clients.find(x=>x.id===viewClientDetailId);
  if(!c){ viewClientDetailId=null; return ''; }
  const s = state.loyaltySettings;
  const history = (c.history||[]).slice().sort((a,b)=>b.date-a.date);
  const activeCoupons = (c.coupons||[]).filter(cp=>!cp.redeemed);
  const usedCoupons = (c.coupons||[]).filter(cp=>cp.redeemed);
  const visitasRestantes = s.visitCount - (c.visitCycle||0);
  const faltaCompra = Math.max(0, s.purchaseThreshold - (c.purchaseAccum||0));

  const historyHtml = history.map(h=>{
    let icon='📋', color='var(--text)';
    if(h.type==='visit'){ icon='📍'; color='var(--navy)'; }
    else if(h.type==='purchase'){ icon='🛍️'; color='var(--success)'; }
    else if(h.type==='coupon_generated'){ icon='🎁'; color='#AF52DE'; }
    else if(h.type==='register'){ icon='✨'; color='var(--turquoise-dark)'; }
    else if(h.type==='coupon_redeemed'){ icon='✅'; color='var(--text-muted)'; }
    return `<div class="loy-history-item">
      <div class="loy-history-icon" style="background:${color}20;color:${color};">${icon}</div>
      <div style="flex:1;min-width:0;">
        <div class="loy-history-desc">${escapeHtml(h.description)}</div>
        <div class="loy-history-date">${formatTimeAgo(h.date)} · ${formatLoyDate(h.date)}</div>
        ${h.amount ? `<div class="loy-history-amount">${money(h.amount)}</div>` : ''}
      </div>
    </div>`;
  }).join('') || `<div style="text-align:center;color:var(--text-muted);padding:20px;">Sin movimientos registrados</div>`;

  let couponsHtml = '';
  if(activeCoupons.length || usedCoupons.length){
    couponsHtml = `<div class="loy-detail-section"><h4>🎟️ Cupones</h4>`;
    activeCoupons.forEach(cp=>{
      couponsHtml += `<div class="loy-coupon-item loy-coupon-active"><div><strong>${cp.code}</strong> · ${cp.pct}% OFF</div><div style="font-size:11px;color:var(--text-muted);">${cp.source==='compra'?'Por compra':'Por visitas'} · ${formatTimeAgo(cp.createdAt)}</div></div>`;
    });
    usedCoupons.forEach(cp=>{
      couponsHtml += `<div class="loy-coupon-item loy-coupon-used"><div><strong>${cp.code}</strong> · ${cp.pct}% OFF</div><div style="font-size:11px;color:var(--text-muted);">Usado · ${formatTimeAgo(cp.createdAt)}</div></div>`;
    });
    couponsHtml += `</div>`;
  }

  let doctorHtml = '';
  if(c.type==='medico' && c.doctorCode){
    const dc = c.doctorCode;
    doctorHtml = `<div class="loy-detail-section"><h4>🩺 Código de médico</h4>
      <div style="background:#F2E7FE;border-radius:10px;padding:11px;font-size:13px;">
        <div><strong>${dc.code}</strong> · ${dc.pct}% OFF</div>
        <div style="font-size:11px;color:var(--text-muted);">${dc.usageCount} uso(s) · ${dc.active?'Activo':'Inactivo'}</div>
      </div>
    </div>`;
  }

  return `<div class="loy-detail-overlay" onclick="if(event.target===this){closeClientDetailOverlay();}">
    <div class="loy-detail-panel">
      <div class="loy-detail-header">
        <button class="loy-detail-back" onclick="closeClientDetailOverlay()">← Volver</button>
        <button class="loy-detail-edit" onclick="viewClientDetailId=null; openEditClientModal('${c.id}')">✏️ Editar</button>
      </div>
      <div class="loy-detail-info">
        <div class="loy-detail-avatar">${escapeHtml(c.name.charAt(0))}</div>
        <h3>${escapeHtml(c.name)}</h3>
        <span class="loy-type loy-type-${c.type}">${TYPE_LABELS[c.type]}</span>
        ${c.phone ? `<div class="loy-detail-phone">📱 ${escapeHtml(c.phone)}</div>` : ''}
        <div class="loy-detail-since">Registrado: ${formatLoyDate(c.createdAt)}</div>
      </div>
      <div class="loy-detail-stats">
        <div class="loy-detail-stat">
          <div class="loy-detail-stat-value">${c.visits||0}</div>
          <div class="loy-detail-stat-label">Visitas totales</div>
          <div class="loy-detail-stat-sub">${visitasRestantes>0?'Faltan '+visitasRestantes+' para cupón':'¡Cupón listo!'}</div>
        </div>
        <div class="loy-detail-stat">
          <div class="loy-detail-stat-value">${money(c.purchaseTotal||0)}</div>
          <div class="loy-detail-stat-label">Compras totales</div>
          <div class="loy-detail-stat-sub">${faltaCompra>0?'Faltan '+money(faltaCompra)+' para cupón':'¡Cupón listo!'}</div>
        </div>
      </div>
      ${doctorHtml}
      ${couponsHtml}
      <div class="loy-detail-section">
        <h4>📜 Historial de movimientos</h4>
        <div>${historyHtml}</div>
      </div>
    </div>
  </div>`;
}

/* ========= HANDLERS ========= */
function attachHandlers(){
  // Navegación
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click', ()=>{
      setView(el.getAttribute('data-nav'));
      const sb = document.getElementById('sidebar');
      if(sb) sb.classList.remove('open');
      document.body.classList.remove('sidebar-open');
    });
  });

  const menuToggle = document.getElementById('menu-toggle');
  if(menuToggle){
    menuToggle.addEventListener('click', ()=>{
      document.getElementById('sidebar').classList.toggle('open');
      document.body.classList.toggle('sidebar-open');

  document.querySelectorAll('[data-add-quote-product]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-add-quote-product');
      const p = state.products.find(x=>x.id===id);
      if(!p) return;
      const existing = quoteEditCart.find(i=>i.productId===id);
      if(existing){ existing.qty += 1; } else { quoteEditCart.push({productId:id, qty:1}); }
      render();
    });
  });
  document.querySelectorAll('[data-quote-qty-plus]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); const it = quoteEditCart.find(i=>i.productId===el.getAttribute('data-quote-qty-plus')); if(it){ it.qty+=1; render(); } });
  });
  document.querySelectorAll('[data-quote-qty-minus]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      e.stopPropagation();
      const id = el.getAttribute('data-quote-qty-minus');
      const it = quoteEditCart.find(i=>i.productId===id);
      if(it){ it.qty-=1; if(it.qty<=0){ quoteEditCart = quoteEditCart.filter(i=>i.productId!==id); } render(); }
    });
  });
  document.querySelectorAll('[data-quote-qty-input]').forEach(el=>{
    el.addEventListener('input', (e)=>{
      e.stopPropagation();
      const id = el.getAttribute('data-quote-qty-input');
      const it = quoteEditCart.find(i=>i.productId===id);
      if(it){
        it.qty = Math.max(0, Number(e.target.value)||0);
        render();
        const ne = document.querySelector(`[data-quote-qty-input="${id}"]`);
        if(ne){ ne.focus(); ne.setSelectionRange(ne.value.length, ne.value.length); }
      }
    });
    el.addEventListener('blur', (e)=>{
      const id = el.getAttribute('data-quote-qty-input');
      const it = quoteEditCart.find(i=>i.productId===id);
      if(it && it.qty<=0){ quoteEditCart = quoteEditCart.filter(i=>i.productId!==id); render(); }
    });
    el.addEventListener('click', (e)=>e.stopPropagation());
  });
  document.querySelectorAll('[data-quote-price-input]').forEach(el=>{
    el.addEventListener('input', (e)=>{
      e.stopPropagation();
      const id = el.getAttribute('data-quote-price-input');
      const it = quoteEditCart.find(i=>i.productId===id);
      if(it){
        const cleaned = String(e.target.value).replace(/[^0-9.]/g,'');
        it.price = Math.max(0, Number(cleaned)||0);
        render();
        const ne = document.querySelector(`[data-quote-price-input="${id}"]`);
        if(ne){ ne.focus(); ne.setSelectionRange(ne.value.length, ne.value.length); }
      }
    });
    el.addEventListener('click', (e)=>e.stopPropagation());
  });
  document.querySelectorAll('[data-remove-quote-item]').forEach(el=>{
    el.addEventListener('click', (e)=>{ e.stopPropagation(); quoteEditCart = quoteEditCart.filter(i=>i.productId!==el.getAttribute('data-remove-quote-item')); render(); });
  });
  const clearQuoteCartEl = document.querySelector('[data-clear-quote-cart]');
  if(clearQuoteCartEl){ clearQuoteCartEl.addEventListener('click', ()=>{ quoteEditCart = []; render(); }); }
  const finalizeQuoteEl = document.querySelector('[data-finalize-quote]');
  if(finalizeQuoteEl){ finalizeQuoteEl.addEventListener('click', ()=>{ if(quoteEditCart.length){ quoteModalOpen = true; render(); } }); }

  // ----- COTIZACIONES: lista y panel de detalle -----
  document.querySelectorAll('[data-view-quote]').forEach(el=>{
    el.addEventListener('click', ()=>{ quoteDetailId = el.getAttribute('data-view-quote'); render(); });
  });
  document.querySelectorAll('[data-close-quote-detail]').forEach(el=>{
    el.addEventListener('click', (e)=>{ if(e.target!==el) return; quoteDetailId = null; render(); });
  });
  const editQuoteEl = document.querySelector('[data-edit-quote]');
  if(editQuoteEl){
    editQuoteEl.addEventListener('click', ()=>{
      const id = editQuoteEl.getAttribute('data-edit-quote');
      const q = state.quotes.find(x=>x.id===id);
      if(!q) return;
      editingQuoteId = id;
      quoteEditCart = (q.items||[]).map(it=>({productId:it.productId, qty:it.qty, price:it.price}));
      quoteEditMode = true;
      quoteDetailId = null;
      render();
    });
  }
  const registerQuoteSaleEl = document.querySelector('[data-register-quote-sale]');
  if(registerQuoteSaleEl){
    registerQuoteSaleEl.addEventListener('click', ()=>{
      convertQuoteToSale(registerQuoteSaleEl.getAttribute('data-register-quote-sale'));
    });
  }
  const downloadQuoteEl = document.querySelector('[data-download-quote]');
  if(downloadQuoteEl){ downloadQuoteEl.addEventListener('click', ()=>{ downloadQuoteReceipt(downloadQuoteEl.getAttribute('data-download-quote')); }); }
  const printQuoteEl = document.querySelector('[data-print-quote]');
  if(printQuoteEl){ printQuoteEl.addEventListener('click', ()=>{ printQuoteReceipt(printQuoteEl.getAttribute('data-print-quote')); }); }
  const formalQuoteEl = document.querySelector('[data-formal-quote]');
  if(formalQuoteEl){
    formalQuoteEl.addEventListener('click', ()=>{
      const q = state.quotes.find(x=>x.id===formalQuoteEl.getAttribute('data-formal-quote'));
      if(q) openFormalDocument(buildFormalQuoteHTML(q));
    });
  }
  const deleteQuoteEl = document.querySelector('[data-confirm-delete-quote]');
  if(deleteQuoteEl){
    deleteQuoteEl.addEventListener('click', ()=>{
      quoteDeleteConfirmId = deleteQuoteEl.getAttribute('data-confirm-delete-quote');
      render();
    });
  }
  document.querySelectorAll('[data-cancel-delete-quote]').forEach(el=>{
    el.addEventListener('click', (e)=>{ if(e.target!==el) return; quoteDeleteConfirmId = null; render(); });
  });
  const confirmDeleteQuoteFinalEl = document.querySelector('[data-confirm-delete-quote-final]');
  if(confirmDeleteQuoteFinalEl){
    confirmDeleteQuoteFinalEl.addEventListener('click', ()=>{
      const id = confirmDeleteQuoteFinalEl.getAttribute('data-confirm-delete-quote-final');
      state.quotes = state.quotes.filter(x=>x.id!==id);
      quoteDeleteConfirmId = null;
      quoteDetailId = null;
      persist(); render();
      showToast('Cotización eliminada');
    });
  }


  // ----- INVENTARIO: producto y categoría -----
  const openProductBtn = document.querySelector('[data-open-product]');
  if(openProductBtn){ openProductBtn.addEventListener('click', ()=>{ productPrefillName=''; productCatalog=true; productImageData=null; editingProductId=null; productEditPrefill={}; productModalOpen = true; render(); }); }
  const openProductFromSearchBtn = document.querySelector('[data-open-product-from-search]');
  if(openProductFromSearchBtn){ openProductFromSearchBtn.addEventListener('click', ()=>{ productPrefillName = venderSearch; productCatalog=true; productImageData=null; editingProductId=null; productEditPrefill={}; productModalOpen = true; render(); }); }
  document.querySelectorAll('[data-edit-full-product]').forEach(editFullProductBtn=>{
    editFullProductBtn.addEventListener('click', ()=>{
      const id = editFullProductBtn.getAttribute('data-edit-full-product');
      const p = state.products.find(x=>x.id===id);
      if(!p) return;
      editingProductId = id;
      productPrefillName = p.name;
      productImageData = p.image || null;
      productCatalog = p.catalog !== false;
      productEditPrefill = {
        sku: p.sku||'', category: p.category||'', stock: p.stock, minStock: p.minStock,
        price: p.price, cost: p.cost, description: p.description||'', tax: p.tax||''
      };
      productModalOpen = true;
      render();
    });
  });
  const toggleCatalogEl = document.querySelector('[data-toggle-catalog]');
  if(toggleCatalogEl){ toggleCatalogEl.addEventListener('click', ()=>{ productCatalog = !productCatalog; render(); }); }
  const productImageInput = document.getElementById('product-image-input');
  if(productImageInput){
    productImageInput.addEventListener('change', (e)=>{
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      if(file.size > 3*1024*1024){ showToast('La imagen es muy pesada (máx. 3MB)'); return; }
      const reader = new FileReader();
      reader.onload = ()=>{ productImageData = reader.result; render(); };
      reader.readAsDataURL(file);
    });
  }
  const removeProductImageEl = document.querySelector('[data-remove-product-image]');
  if(removeProductImageEl){ removeProductImageEl.addEventListener('click', ()=>{ productImageData = null; render(); }); }
  const saveProductBtn = document.querySelector('[data-save-product]');
  if(saveProductBtn){
    saveProductBtn.addEventListener('click', ()=>{
      const name = document.getElementById('product-name').value.trim();
      const sku = document.getElementById('product-sku').value.trim();
      const category = document.getElementById('product-category').value;
      const price = Number(document.getElementById('product-price').value)||0;
      const cost = Number(document.getElementById('product-cost').value)||0;
      const stock = Number(document.getElementById('product-stock').value)||0;
      const minStock = Number(document.getElementById('product-min-stock').value)||0;
      const description = document.getElementById('product-description').value.trim();
      const tax = document.getElementById('product-tax').value;
      if(!name || price<=0){ showToast('Completa nombre y precio de venta'); return; }
      if(editingProductId){
        const p = state.products.find(x=>x.id===editingProductId);
        if(p){
          Object.assign(p, {name, sku, category: category||CATEGORIES[0], price, cost, stock, minStock, description, tax, image: productImageData||null, catalog: productCatalog});
        }
        showToast('Producto actualizado');
      } else {
        state.products.push({id:uid('p'), name, sku, category: category||CATEGORIES[0], price, cost, stock, minStock, description, tax, image: productImageData||null, catalog: productCatalog});
        showToast('Producto creado');
      }
      productModalOpen = false;
      productImageData = null;
      editingProductId = null;
      productEditPrefill = {};
      persist(); render();
    });
  }
  const deleteProductLinkBtn = document.querySelector('[data-delete-product]');
  if(deleteProductLinkBtn){
    deleteProductLinkBtn.addEventListener('click', ()=>{
      confirmDeleteProductId = deleteProductLinkBtn.getAttribute('data-delete-product');
      productModalOpen = false;
      render();
    });
  }
  document.querySelectorAll('[data-cancel-delete-product]').forEach(el=>{
    el.addEventListener('click', (e)=>{ if(e.target!==el) return; confirmDeleteProductId = null; render(); });
  });
  const confirmDeleteProductBtn = document.querySelector('[data-confirm-delete-product]');
  if(confirmDeleteProductBtn){
    confirmDeleteProductBtn.addEventListener('click', ()=>{
      const id = confirmDeleteProductBtn.getAttribute('data-confirm-delete-product');
      state.products = state.products.filter(p=>p.id!==id);
      confirmDeleteProductId = null;
      editingProductId = null;
      persist(); render();
      showToast('Producto eliminado');
    });
  }
  const openCategoryBtn = document.querySelector('[data-open-category]');
  if(openCategoryBtn){ openCategoryBtn.addEventListener('click', ()=>{ categoryModalOpen = true; render(); }); }
  const downloadInventoryReportEl = document.querySelector('[data-download-inventory-report]');
  if(downloadInventoryReportEl){
    downloadInventoryReportEl.addEventListener('click', ()=>{
      openFormalDocument(buildInventoryReportHTML());
    });
  }

  // ----- RESURTIMIENTO -----
  const openRestockBtn = document.querySelector('[data-open-restock]');
  if(openRestockBtn){
    openRestockBtn.addEventListener('click', ()=>{
      restockMode = true; restockSearch = ''; restockCart = [];
      render();
    });
  }
  const backFromRestockEl = document.querySelector('[data-back-from-restock]');
  if(backFromRestockEl){
    backFromRestockEl.addEventListener('click', ()=>{ restockMode = false; restockCart = []; render(); });
  }
  const restockSearchEl = document.getElementById('restock-search');
  if(restockSearchEl){
    restockSearchEl.addEventListener('input', (e)=>{
      restockSearch = e.target.value;
      const pos = e.target.selectionStart;
      render();
      const ne = document.getElementById('restock-search');
      if(ne){ ne.focus(); ne.setSelectionRange(pos,pos); }
    });
  }
  document.querySelectorAll('[data-add-restock]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-add-restock');
      const existing = restockCart.find(i=>i.productId===id);
      if(existing){ existing.qty += 1; } else { restockCart.push({productId:id, qty:1}); }
      render();
    });
  });
  const clearRestockEl = document.querySelector('[data-clear-restock]');
  if(clearRestockEl){ clearRestockEl.addEventListener('click', ()=>{ restockCart = []; render(); }); }
  document.querySelectorAll('[data-remove-restock]').forEach(el=>{
    el.addEventListener('click', ()=>{ restockCart = restockCart.filter(i=>i.productId!==el.getAttribute('data-remove-restock')); render(); });
  });
  document.querySelectorAll('[data-restock-qty-plus]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const it = restockCart.find(i=>i.productId===el.getAttribute('data-restock-qty-plus'));
      if(it){ it.qty += 1; render(); }
    });
  });
  document.querySelectorAll('[data-restock-qty-minus]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.getAttribute('data-restock-qty-minus');
      const it = restockCart.find(i=>i.productId===id);
      if(it){ it.qty -= 1; if(it.qty<=0){ restockCart = restockCart.filter(i=>i.productId!==id); } render(); }
    });
  });
  document.querySelectorAll('[data-restock-qty-input]').forEach(el=>{
    el.addEventListener('input', (e)=>{
      const id = el.getAttribute('data-restock-qty-input');
      const it = restockCart.find(i=>i.productId===id);
      if(it){
        it.qty = Math.max(0, Number(e.target.value)||0);
        render();
        const ne = document.querySelector(`[data-restock-qty-input="${id}"]`);
        if(ne){ ne.focus(); ne.setSelectionRange(ne.value.length, ne.value.length); }
      }
    });
    el.addEventListener('blur', ()=>{
      const id = el.getAttribute('data-restock-qty-input');
      const it = restockCart.find(i=>i.productId===id);
      if(it && it.qty<=0){ restockCart = restockCart.filter(i=>i.productId!==id); render(); }
    });
  });
  document.querySelectorAll('[data-generate-restock-pdf]').forEach(el=>{
    el.addEventListener('click', ()=>{ generateRestockPDF(el.getAttribute('data-generate-restock-pdf')==='prices'); });
  });

  const saveCategoryBtn = document.querySelector('[data-save-category]');
  if(saveCategoryBtn){
    saveCategoryBtn.addEventListener('click', ()=>{
      const name = document.getElementById('category-name').value.trim();
      if(!name){ showToast('Escribe el nombre de la categoría'); return; }
      if(!CATEGORIES.includes(name)){
        CATEGORIES.push(name);
        CATEGORIES.sort();
        persist();
      }
      categoryModalOpen = false;
      render();
      showToast('Categoría creada');
    });
  }

  // ----- MODALES: cerrar -----
  document.querySelectorAll('[data-close-modal]').forEach(el=>{
    el.addEventListener('click', (e)=>{
      if(e.target !== el) return;
      const which = el.getAttribute('data-close-modal');
      if(which==='quote') quoteModalOpen=false;
      if(which==='expense') expenseModalOpen=false;
      if(which==='product') productModalOpen=false;
      if(which==='category') categoryModalOpen=false;
      if(which==='cashcalc') cashCalcOpen=false;
      render();
    });
  });
}

render();
syncFromGoogleSheets();
</script>
</body>
</html>
