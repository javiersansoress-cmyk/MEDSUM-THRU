<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEDSUM · Gestión de negocio</title>
<style>
  :root{
    --navy:#0B2A45;
    --navy-2:#123A63;
    --turquoise:#30B0C7;
    --turquoise-dark:#0A8CA6;
    --turquoise-light:#E1F5F9;
    --bg:#F2F2F7;
    --card:#FFFFFF;
    --text:#1C1C1E;
    --text-muted:#6E7681;
    --border:#E5E5EA;
    --danger:#FF3B30;
    --danger-light:#FDEAEA;
    --success:#34C759;
    --success-light:#E6F9EC;
    --radius:18px;
    --shadow: 0 2px 10px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#D1D1D6;border-radius:12px;}

  .app{display:flex;min-height:100vh;}

  /* Sidebar: capa fija e independiente, siempre del tamaño exacto de la pantalla */
  .sidebar{
    width:230px;flex-shrink:0;background:var(--navy);
    background-image:linear-gradient(180deg,var(--navy) 0%, var(--navy-2) 100%);
    color:#fff;display:flex;flex-direction:column;padding:20px 14px;
    border-radius:0 28px 28px 0;
    position:fixed;top:0;left:0;bottom:0;height:100vh;
    overflow-y:auto;overflow-x:visible;z-index:50;
  }
  
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 22px 8px;}
  .brand-mark{
    width:34px;height:34px;border-radius:10px;
    background:linear-gradient(135deg,var(--turquoise),#0A8CA6);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#fff;
    box-shadow:0 2px 8px rgba(48,176,199,0.4);
  }
  .brand-text{line-height:1.1;}
  .brand-text b{display:block;font-size:15px;letter-spacing:0.4px;}
  .brand-text span{display:block;font-size:10px;color:#8FB4CC;letter-spacing:0.6px;}

  .nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:0.8px;color:#7098B5;margin:18px 12px 8px;font-weight:700;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;
    color:#C9DCE9;text-decoration:none;font-size:13.5px;cursor:pointer;margin-bottom:2px;font-weight:500;
    transition:background .2s cubic-bezier(0.2,0.8,0.2,1), color .2s ease;
  }
  .nav-item svg{width:17px;height:17px;flex-shrink:0;}
  .nav-item:hover{background:rgba(255,255,255,0.08);color:#fff;}
  .nav-item.active{background:rgba(255,255,255,0.14);color:#fff;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08);}
  .sidebar-footer{margin-top:auto;padding:10px 10px 2px;font-size:10.5px;color:#5D7E96;}

  /* Main: se desplaza a la derecha del ancho fijo del sidebar */
  .main{flex:1;min-width:0;display:flex;flex-direction:column;margin-left:230px;}
  .topbar{
    background:rgba(242,242,247,0.82);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(0,0,0,0.06);
    padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    position:sticky;top:0;z-index:20;
  }
  .topbar h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-0.3px;}
  .topbar-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

  .btn{
    border:none;border-radius:12px;padding:10px 16px;font-size:13.5px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:transform .15s cubic-bezier(0.2,0.8,0.2,1), filter .15s ease, opacity .15s ease;
    white-space:nowrap;
  }
  .btn:active{transform:scale(0.96);opacity:0.9;}
  .btn-primary{background:var(--turquoise);color:#fff;}
  .btn-primary:hover{filter:brightness(0.96);}
  .btn-danger{background:var(--danger);color:#fff;}
  .btn-danger:hover{filter:brightness(0.96);}
  .btn-outline{background:#fff;border:1px solid var(--border);color:var(--text);}
  .btn-outline:hover{background:#FAFAFC;}
  .btn-ghost{background:transparent;color:var(--text-muted);padding:6px 10px;}
  .btn-ghost:hover{color:var(--text);}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:10px;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}

  .content{padding:24px 28px;overflow-y:auto;flex:1;}

  .vender-products-col{ margin-right:340px; }
  .vender-cart-panel{
    width:320px;padding:18px;
    position:fixed;top:118px;right:28px;
    max-height:calc(100vh - 138px);overflow-y:auto;
    z-index:15;
  }
  @media (max-width:1100px){
    .vender-cart-panel{ position:static; width:auto; max-height:none; }
    .vender-products-col{ margin-right:0; }
  }

  .card{background:var(--card);border:1px solid rgba(0,0,0,0.03);border-radius:var(--radius);box-shadow:var(--shadow);transition:box-shadow .2s ease;}

  input, select{
    font-family:inherit;font-size:14px;border:1px solid transparent;border-radius:12px;
    padding:10px 13px;color:var(--text);background:var(--bg);outline:none;
    transition:border-color .15s ease, background .15s ease;
  }
  input:focus, select:focus{border-color:var(--turquoise);background:#fff;box-shadow:0 0 0 4px var(--turquoise-light);}

  .chip{
    padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;border:none;
    background:rgba(118,118,128,0.12);color:var(--text);cursor:pointer;white-space:nowrap;
    transition:background .15s ease, color .15s ease;
  }
  .chip.active{background:var(--navy);color:#fff;}

  .badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700;}
  .badge-success{background:var(--success-light);color:#1F9C46;}
  .badge-danger{background:var(--danger-light);color:var(--danger);}
  .badge-muted{background:rgba(118,118,128,0.14);color:var(--text-muted);}
  .badge-warn{background:#FFF3DC;color:#B7791F;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--text-muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:0.5px;padding:12px 14px;border-bottom:1px solid var(--border);}
  td{padding:13px 14px;border-bottom:1px solid var(--border);}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(118,118,128,0.04);}

  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text-muted);text-align:center;}
  .empty-state svg{width:52px;height:52px;color:#C7C7CC;margin-bottom:14px;}
  .empty-state b{color:var(--text);font-size:14.5px;margin-bottom:4px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  .modal{background:#fff;border-radius:22px;width:100%;max-width:460px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.25);}
  .modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .modal-header h3{margin:0;font-size:17px;font-weight:700;}
  .modal-body{padding:22px 24px;display:flex;flex-direction:column;gap:14px;}
  .modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:11.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.3px;}
  .field input, .field select{width:100%;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}

  .toast{
    position:fixed;bottom:24px;right:24px;background:rgba(28,28,30,0.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;padding:12px 20px;border-radius:14px;
    font-size:13.5px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,0.25);z-index:200;
    display:flex;align-items:center;gap:8px;animation:toast-in .25s cubic-bezier(0.2,0.8,0.2,1);
  }
  @keyframes toast-in{from{opacity:0;transform:translateY(10px) scale(0.98);}to{opacity:1;transform:translateY(0) scale(1);}}

  ::placeholder{color:#9AAAB8;}

  #sidebar-backdrop{display:none;}

  @media (max-width:900px){
    .sidebar{left:-230px;z-index:95;transition:left .2s ease;}
    .sidebar.open{left:0;}
    .main{margin-left:0;}
    .menu-toggle{display:inline-flex !important;}
    body.sidebar-open #sidebar-backdrop{
      display:block;position:fixed;inset:0;background:rgba(11,42,69,0.45);z-index:90;
    }
  }
  .menu-toggle{display:none;background:transparent;border:none;cursor:pointer;padding:6px;}

  @media (max-width:640px){
    .content{padding:14px;}
    .topbar{padding:12px 14px;}
    .topbar h1{font-size:17px;}
    .topbar-actions{width:100%;}
    .topbar-actions .btn{flex:1;justify-content:center;}
    table{font-size:12.5px;}
    th{padding:9px 8px;font-size:9.5px;}
    td{padding:10px 8px;}
    .modal{border-radius:16px 16px 0 0;max-width:100%;max-height:94vh;position:fixed;bottom:0;left:0;right:0;margin:0;}
    .modal-overlay{padding:0;align-items:flex-end;}
    .modal-body{grid-template-columns:1fr !important;}
    .field-row{flex-direction:column;gap:14px;}
    .sale-success-panel, .loy-detail-panel{width:100vw !important;max-width:100vw;}
    .card[style*="width:320px"], .card[style*="width:340px"], .card[style*="width:420px"], .card[style*="width:460px"]{width:100% !important;}
    div[style*="display:grid;grid-template-columns:repeat(auto-fill"]{grid-template-columns:repeat(auto-fill,minmax(130px,1fr)) !important;}
    .btn-sm{padding:9px 12px;}
    input, select{font-size:16px;}
    [data-qty-plus],[data-qty-minus],[data-restock-qty-plus],[data-restock-qty-minus],[data-quote-qty-plus],[data-quote-qty-minus]{padding:6px;}

    /* Vender / Resurtimiento / Cotizador: apilar en columna, con el carrito arriba del catálogo */
    .shop-layout{flex-direction:column !important;}
    .shop-layout > div[class*="card"]{position:static !important;top:auto !important;right:auto !important;order:-1;max-height:none !important;}
  }

  /* ===== FIDELIDAD DE CLIENTES (estilo app original) ===== */
  .loy-header{
    background:linear-gradient(180deg,#0B2545 0%,#123A63 100%);color:#fff;padding:22px 22px 20px;
    border-radius:20px;position:relative;overflow:hidden;margin-bottom:16px;
  }
  .loy-header::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,rgba(48,176,199,0.35) 0%,transparent 70%);}
  .loy-brand{display:flex;align-items:center;gap:10px;position:relative;z-index:1;}
  .loy-brand .mark{width:34px;height:34px;border-radius:9px;background:#30B0C7;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;}
  .loy-brand .word{font-weight:700;font-size:18px;letter-spacing:-0.02em;}
  .loy-brand .word span{color:#30B0C7;}
  .loy-tag{margin-top:4px;font-size:12.5px;color:rgba(255,255,255,0.7);position:relative;z-index:1;}
  .loy-stats{display:flex;gap:10px;margin-top:16px;position:relative;z-index:1;}
  .loy-stat-pill{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.18);border-radius:14px;padding:10px;flex:1;text-align:center;}
  .loy-stat-pill .n{font-size:18px;font-weight:700;}
  .loy-stat-pill .l{font-size:9.5px;color:rgba(255,255,255,0.7);text-transform:uppercase;letter-spacing:0.05em;margin-top:2px;font-weight:600;}

  .loy-subtabs{display:flex;background:#EEF1F4;border-radius:12px;padding:3px;margin-bottom:16px;}
  .loy-subtabs button{flex:1;border:none;background:transparent;color:var(--text);padding:8px 10px;border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;}
  .loy-subtabs button.active{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,0.1);}

  .loy-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 3px 14px rgba(0,0,0,0.05);border:1px solid rgba(0,0,0,0.03);}
  .loy-name-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .loy-name{font-size:15.5px;font-weight:700;letter-spacing:-0.01em;cursor:pointer;}
  .loy-phone{font-size:12.5px;color:var(--text-muted);margin-top:2px;}

  .loy-type{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:11px;}
  .loy-type-publico{background:#E5E5EA;color:#48484A;}
  .loy-type-medico{background:#F2E7FE;color:#AF52DE;}
  .loy-type-clinica{background:#FFE5EC;color:#D6336C;}
  .loy-type-farmacia{background:#E1F9EB;color:#1F9254;}

  .loy-progress{margin-top:12px;background:var(--bg);border-radius:12px;padding:10px 12px;}
  .loy-progress-line{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .loy-progress-line:last-child{margin-bottom:0;}
  .loy-plabel{font-size:11px;color:var(--text-muted);font-weight:700;min-width:88px;}
  .loy-blister{display:flex;gap:5px;align-items:center;}
  .loy-pocket{width:17px;height:17px;border-radius:50%;border:2px solid var(--turquoise);background:transparent;flex-shrink:0;}
  .loy-pocket.filled{background:var(--turquoise);}
  .loy-vial{flex:1;height:9px;border-radius:5px;background:var(--light-gray,#E5E5EA);overflow:hidden;}
  .loy-vial-fill{height:100%;background:#AF52DE;border-radius:5px;}
  .loy-vial-text{font-size:10.5px;color:var(--text-muted);font-weight:700;white-space:nowrap;}

  .loy-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .loy-btn{border:none;border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:700;cursor:pointer;flex:1;text-align:center;}
  .loy-btn-visit{background:var(--navy);color:#fff;}
  .loy-btn-purchase{background:#AF52DE;color:#fff;}
  .loy-btn-wa{background:#25D366;color:#fff;flex:0 0 auto;padding:9px 16px;}
  .loy-menu-btn{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px;padding:4px;}

  .loy-ticket{margin-top:10px;background:#FFF9E6;border:1px solid #FFE58F;border-radius:12px;padding:11px 13px;position:relative;}
  .loy-ticket.compra{background:#F8F0FE;border-color:#E2B6FF;}
  .loy-ticket.redeemed{opacity:0.5;}
  .loy-ticket .code-label{font-size:9.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);font-weight:700;}
  .loy-ticket .code{font-family:'SF Mono',Menlo,monospace;font-weight:700;font-size:15px;margin-top:1px;}
  .loy-ticket .meta{display:flex;justify-content:space-between;align-items:center;margin-top:7px;gap:8px;}
  .loy-ticket .pct{font-size:12.5px;font-weight:700;color:var(--navy);}
  .loy-ticket .redeemed-tag{position:absolute;top:9px;right:12px;font-size:9.5px;font-weight:700;color:var(--danger);text-transform:uppercase;}
  .loy-copy-btn{background:var(--navy);color:#fff;border:none;border-radius:11px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;}

  .loy-doctor-box{margin-top:12px;background:#F2E7FE;border-radius:12px;padding:12px;}
  .loy-doctor-box h4{margin:0 0 3px;font-size:13px;color:#AF52DE;}
  .loy-doctor-box .sub{font-size:11.5px;color:var(--text-muted);margin-bottom:8px;}
  .loy-doctor-code-display{background:#fff;border-radius:10px;padding:9px 11px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .loy-doctor-code-display .code{font-family:'SF Mono',Menlo,monospace;font-weight:700;font-size:14px;}

  .loy-empty{text-align:center;padding:50px 20px;color:var(--text-muted);}
  .loy-empty .icon{font-size:36px;margin-bottom:8px;}
  .loy-empty .t{font-size:15px;font-weight:700;color:var(--text);margin-bottom:4px;}

  .loy-sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:flex-end;justify-content:center;z-index:500;}
  .loy-sheet{background:#fff;width:100%;max-width:480px;border-top-left-radius:22px;border-top-right-radius:22px;padding:22px 20px 28px;box-shadow:0 -10px 40px rgba(0,0,0,0.15);}
  .loy-sheet h4{margin:0 0 8px;font-size:17px;}
  .loy-sheet p{font-size:13px;color:var(--text-muted);margin:0 0 18px;line-height:1.4;}
  .loy-sheet .btns{display:flex;gap:10px;}
  .loy-sheet .btns button{flex:1;}
  .loy-type-select{display:flex;gap:7px;flex-wrap:wrap;}
  .loy-type-opt{flex:1;min-width:70px;text-align:center;padding:9px 6px;border-radius:10px;border:1px solid var(--border);font-size:11.5px;font-weight:700;color:var(--text-muted);cursor:pointer;background:var(--bg);}
  .loy-type-opt.selected{border-color:var(--turquoise);background:var(--turquoise);color:#fff;}

  .loy-detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:250;display:flex;justify-content:center;}
  .loy-detail-panel{background:var(--bg);width:100%;max-width:520px;height:100vh;overflow-y:auto;}
  .loy-detail-header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;}
  .loy-detail-back,.loy-detail-edit{border:none;background:none;color:var(--turquoise-dark);font-size:14px;font-weight:700;cursor:pointer;padding:6px;}
  .loy-detail-info{background:#fff;padding:22px 20px;text-align:center;border-bottom:1px solid var(--border);}
  .loy-detail-avatar{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#30B0C7,#007AFF);color:#fff;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;}
  .loy-detail-info h3{margin:0 0 6px;font-size:19px;font-weight:700;}
  .loy-detail-phone,.loy-detail-since{font-size:12.5px;color:var(--text-muted);margin-top:4px;}
  .loy-detail-stats{display:flex;gap:10px;padding:14px 20px;}
  .loy-detail-stat{flex:1;background:#fff;border-radius:14px;padding:14px;text-align:center;}
  .loy-detail-stat-value{font-size:19px;font-weight:700;color:var(--navy);}
  .loy-detail-stat-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;margin-top:3px;font-weight:700;}
  .loy-detail-stat-sub{font-size:10.5px;color:var(--turquoise-dark);margin-top:3px;font-weight:600;}
  .loy-detail-section{background:#fff;margin:10px 20px;border-radius:14px;padding:14px;}
  .loy-detail-section h4{margin:0 0 10px;font-size:14px;font-weight:700;}
  .loy-coupon-item{padding:9px 11px;border-radius:9px;margin-bottom:7px;font-size:12.5px;}
  .loy-coupon-active{background:#FFF9E6;border:1px solid #FFE58F;}
  .loy-coupon-used{background:var(--bg);border:1px solid var(--border);opacity:0.7;}
  .loy-history-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
  .loy-history-item:last-child{border-bottom:none;}
  .loy-history-icon{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
  .loy-history-desc{font-size:13px;font-weight:600;}
  .loy-history-date{font-size:11px;color:var(--text-muted);margin-top:1px;}
  .loy-history-amount{font-size:13px;font-weight:700;color:var(--success);margin-top:1px;}

  /* ===== PANTALLA DE ÉXITO DE VENTA ===== */
  .sale-success-overlay{position:fixed;inset:0;background:rgba(11,37,69,0.45);z-index:400;display:flex;justify-content:flex-end;animation:fadeIn .2s ease;}
  @keyframes slideInRight{from{transform:translateX(100%);}to{transform:translateX(0);}}
  .sale-success-panel{background:#fff;width:440px;max-width:92vw;height:100vh;overflow-y:auto;padding:32px 30px;position:relative;animation:slideInRight .25s cubic-bezier(0.1,0.9,0.2,1);}
  .sale-success-close{position:absolute;top:20px;right:20px;width:34px;height:34px;border-radius:50%;border:none;background:#F0F2F4;color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

  .sale-success-title{text-align:center;font-size:20px;font-weight:800;margin-bottom:6px;}
  .sale-success-sub{text-align:center;font-size:13.5px;color:var(--text-muted);margin-bottom:28px;}
  .sale-receipt-card{background:var(--bg);border-radius:14px;padding:16px 18px;margin-top:20px;}
  .sale-receipt-card p{font-size:12.5px;color:var(--text-muted);margin:2px 0 12px;}
  .sale-receipt-link{display:flex;align-items:center;gap:10px;color:var(--turquoise-dark);font-weight:600;font-size:13.5px;text-decoration:underline;cursor:pointer;margin-bottom:12px;background:none;border:none;padding:0;}
  .sale-receipt-link:last-child{margin-bottom:0;}
</style>

function normalizeQuote(q){
  return Object.assign({
    items:[], clientId:null, clientPhone:'', createdAt:Date.now(), expiresAt:Date.now()+7*86400000, employeeName:'Propietario'
  }, q);
}

function normalizeClient(c){
  return Object.assign({
    type:'publico', visits:0, visitCycle:0, purchaseTotal:0, purchaseAccum:0, coupons:[], history:[], doctorCode:null
  }, c);
}

function seedState(){
  return {
    products: REAL_PRODUCTS.map(p=>({...p})),
    productDataVersion: PRODUCT_DATA_VERSION,
    categories: [...new Set(REAL_PRODUCTS.map(p=>p.category))].sort(),
    clients: REAL_CLIENTS.map(normalizeClient),
    loyaltySettings: Object.assign({}, REAL_LOYALTY_SETTINGS),
    clientDataVersion: CLIENT_DATA_VERSION,
    sales: [],
    expenses: [],
    quotes: [],
    cart: [],
    selectedClientId: null,
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed.clientDataVersion !== CLIENT_DATA_VERSION){
        // Cargar/actualizar a la base de datos real de clientes, conservando ventas/inventario existentes
        parsed.clients = REAL_CLIENTS.map(normalizeClient);
        parsed.loyaltySettings = Object.assign({}, REAL_LOYALTY_SETTINGS);
        parsed.clientDataVersion = CLIENT_DATA_VERSION;
      } else {
        parsed.clients = (parsed.clients||[]).map(normalizeClient);
      }
      if(!parsed.loyaltySettings){
        parsed.loyaltySettings = Object.assign({}, REAL_LOYALTY_SETTINGS);
      }
      if(parsed.productDataVersion !== PRODUCT_DATA_VERSION){
        // Cargar/actualizar al inventario real, conservando ventas y clientes existentes
        parsed.products = REAL_PRODUCTS.map(p=>({...p}));
        parsed.productDataVersion = PRODUCT_DATA_VERSION;
      }
      parsed.quotes = (parsed.quotes||[]).map(normalizeQuote);
      if(!parsed.categories || !parsed.categories.length){
        parsed.categories = [...new Set((parsed.products||[]).map(p=>p.category))].sort();
      }
      return parsed;
    }
  }catch(e){}
  return seedState();
}

const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyd45Ka8ZNEbmRc6D_pF-Jl0OyxB9qNsGfQIpoBgqv3R3j6MiQmcHzkyc1FI3QpVvGn/exec';

function setSyncIndicator(status){
  const el = document.getElementById('sync-indicator');
  if(!el) return;
  const map = {
    saving: {icon:'🔄', text:'Guardando…', color:'#8FB4CC'},
    saved: {icon:'☁️', text:'Guardado', color:'#4ADE9A'},
    error: {icon:'⚠️', text:'Sin conexión, guardado local', color:'#F4A261'},
    loading: {icon:'🔄', text:'Cargando…', color:'#8FB4CC'},
  };
  const s = map[status];
  if(!s) return;
  el.style.color = s.color;
  el.innerHTML = `<span>${s.icon}</span><span>${s.text}</span>`;
}

let __syncTimer = null;
function gsSaveState(){
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: 'data=' + encodeURIComponent(JSON.stringify(state))
  });
}

function persist(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PEGA_AQUI') !== -1) return;
  setSyncIndicator('saving');
  clearTimeout(__syncTimer);
  __syncTimer = setTimeout(()=>{
    gsSaveState().then(()=>{
      setSyncIndicator('saved');
    }).catch(()=>{
      setSyncIndicator('error');
      showToast('No se pudo guardar en Google Sheets, se guardó localmente');
    });
  }, 400);
}

async function syncFromGoogleSheets(){
  if(!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PEGA_AQUI') !== -1) return;
  setSyncIndicator('loading');
  try{
    const res = await fetch(APPS_SCRIPT_URL);
    const text = await res.text();
    if(text && text !== '{}'){
      state = JSON.parse(text);
      render();
      setSyncIndicator('saved');
    } else {
      gsSaveState().then(()=>setSyncIndicator('saved')).catch(()=>setSyncIndicator('error'));
    }
  }catch(e){
    setSyncIndicator('error');
    showToast('Sin conexión con Google Sheets, usando datos locales');
  }
}

function uid(prefix){
  return prefix + '_' + Math.random().toString(36).slice(2,9);
}

function money(n){
  n = Number(n)||0;
  return '$' + n.toLocaleString('es-MX', {minimumFractionDigits: n % 1 === 0 ? 0 : 2, maximumFractionDigits:2});
}

function todayISO(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

const TYPE_LABELS = { publico:'Público', medico:'Médico', clinica:'Clínica', farmacia:'Farmacia' };

function genLoyaltyCode(name, tag){
  const initials = (name||'').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,3).toUpperCase() || 'MED';
  const rand = Math.random().toString(36).slice(2,6).toUpperCase();
  return 'MEDSUM-' + (tag ? tag + '-' : '') + initials + rand;
}

function addLoyaltyClient(name, phone, type){
  const c = {
    id: uid('c'), name, phone, type: type||'publico',
    visits:0, visitCycle:0, purchaseTotal:0, purchaseAccum:0, coupons:[],
    history:[{type:'register', date:Date.now(), description:'Cliente registrado'}],
    doctorCode: type==='medico' ? {code:genLoyaltyCode(name,'DR'), pct:state.loyaltySettings.doctorPct, usageCount:0, active:true, createdAt:Date.now()} : null,
  };
  state.clients.unshift(c);
  return c;
}

function registerVisit(client){
  const s = state.loyaltySettings;
  client.visits = (client.visits||0) + 1;
  client.visitCycle = (client.visitCycle||0) + 1;
  client.history = client.history || [];
  client.history.unshift({type:'visit', date:Date.now(), description:'Visita #'+client.visits});
  if(client.visitCycle >= s.visitCount){
    const code = genLoyaltyCode(client.name, 'V');
    client.coupons.unshift({id:uid('cp'), source:'visitas', code, pct:s.visitPct, createdAt:Date.now(), redeemed:false});
    client.history.unshift({type:'coupon_generated', date:Date.now(), description:'Cupón por visitas: '+code, code, pct:s.visitPct});
    client.visitCycle = 0;
    return code;
  }
  return null;
}

function registerPurchase(client, amount){
  const s = state.loyaltySettings;
  client.purchaseTotal = (client.purchaseTotal||0) + amount;
  client.purchaseAccum = (client.purchaseAccum||0) + amount;
  client.history = client.history || [];
  client.history.unshift({type:'purchase', date:Date.now(), amount, description:'Compra de '+money(amount)});
  const codes = [];
  while(client.purchaseAccum >= s.purchaseThreshold){
    const code = genLoyaltyCode(client.name, 'C');
    client.coupons.unshift({id:uid('cp'), source:'compra', code, pct:s.purchasePct, createdAt:Date.now(), redeemed:false});
    client.history.unshift({type:'coupon_generated', date:Date.now(), description:'Cupón por compras: '+code, code, pct:s.purchasePct});
    client.purchaseAccum -= s.purchaseThreshold;
    codes.push(code);
  }
  return codes;
}

let venderSearch = '';

function rebuildPaymentSplits(n){
  const finalTotal = computeCartFinalTotal();
  if(n===1){
    paymentData.splits = [{amount: finalTotal, method: paymentData.method || 'Efectivo'}];
    return;
  }
  const base = Math.floor((finalTotal/n)*100)/100;
  const splits = [];
  let sum = 0;
  for(let i=0;i<n;i++){
    const amt = i===n-1 ? Math.round((finalTotal-sum)*100)/100 : base;
    splits.push({amount: amt, method: 'Efectivo'});
    sum += amt;
  }
  paymentData.splits = splits;
}
let clientSearchQuery = '';
let clientAddMode = false;
let clientAddType = 'publico';

function renderVender(){
  const filtered = state.products.filter(p=>{
    const matchesCat = venderCategory==='Todos' || p.category===venderCategory;
    const matchesSearch = p.name.toLowerCase().includes(venderSearch.toLowerCase());
    return matchesCat && matchesSearch;
  });

  const cats = ['Todos', ...CATEGORIES];

  const cartTotal = state.cart.reduce((sum,item)=>{
    const p = state.products.find(x=>x.id===item.productId);
    const unitPrice = item.price!=null ? item.price : (p?p.price:0);
    return sum + unitPrice*item.qty;
  },0);
  const cartCount = state.cart.reduce((s,i)=>s+i.qty,0);

  return `
  <div class="shop-layout" style="display:flex;gap:20px;align-items:flex-start;">

        ${cats.map(c=>`<div class="chip ${venderCategory===c?'active':''}" data-cat="${escapeAttr(c)}">${c}</div>`).join('')}
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;">
        ${filtered.length ? filtered.map(p=>ProductCard(p)).join('') : `
          <div class="card" data-open-product-from-search="1" style="padding:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:190px;border:1.5px dashed var(--border);box-shadow:none;">
            <div style="width:40px;height:40px;border-radius:50%;border:2px solid var(--text);display:flex;align-items:center;justify-content:center;margin-bottom:12px;">${ICONS.plus}</div>
            <b style="font-size:14px;">Crear<br/>producto</b>

      </div>

    <div class="card vender-cart-panel">

    return `

          <div style="font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;">${client.name} <span class="badge badge-muted">${TYPE_LABELS[client.type]||'Público'}</span></div>

        </div>

        <div>Compras: <b style="color:var(--text);">${money(client.purchaseAccum||0)}/${money(s.purchaseThreshold)}</b>${purchaseLeft>0?` · faltan ${money(purchaseLeft)} para ${s.purchasePct}% OFF`:' · ¡cupón de compras listo!'}</div>
      </div>
      ${activeCoupons.length ? activeCoupons.map(cp=>{

          <div>
            <div style="font-size:12px;font-weight:700;">${cp.code}</div>

  const q = clientSearchQuery.trim().toLowerCase();

  return `

      ${results.map(c=>`
        <div class="card" data-select-client="${c.id}" style="padding:10px 12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;">
          <div><div style="font-size:13px;font-weight:600;">${c.name}</div><div style="font-size:11.5px;color:var(--text-muted);">${c.phone||'Sin teléfono'} · ${TYPE_LABELS[c.type]||'Público'}</div></div>

        </div>`).join('')}

    ${clientAddMode ? `

        <div class="field" style="margin-bottom:10px;"><label>Nombre</label><input id="new-client-name" placeholder="Nombre del cliente"/></div>
        <div class="field" style="margin-bottom:10px;"><label>Teléfono</label><input id="new-client-phone" placeholder="10 dígitos" value="${escapeAttr(clientSearchQuery.replace(/\D/g,''))}"/></div>

          <label>Tipo de cliente</label>

function ProductCard(p){

  return `
  <div class="card" data-add-product="${p.id}" style="padding:14px;cursor:pointer;opacity:${outOfStock?0.75:1};transition:transform .1s ease;position:relative;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
    ${inCart ? `<div style="position:absolute;top:8px;right:8px;background:var(--navy);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;z-index:2;">${inCart.qty}</div>` : ''}

function CartRow(item){
  const p = state.products.find(x=>x.id===item.productId);
  if(!p) return '';
  const unitPrice = item.price!=null ? item.price : p.price;
  const subtotal = unitPrice * item.qty;
  return `
  <div style="border-bottom:1px solid var(--border);padding-bottom:14px;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
      <div style="width:40px;height:40px;border-radius:12px;flex-shrink:0;overflow:hidden;">${productThumb(p)}</div>
      <div style="flex:1;min-width:0;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${p.name}</div>
      <span data-remove-item="${p.id}" style="color:var(--danger);cursor:pointer;display:flex;flex-shrink:0;">${ICONS.trash}</span>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="display:flex;align-items:center;gap:6px;background:#F3F5F7;border-radius:12px;padding:4px 8px;">
        <span data-qty-minus="${p.id}" style="cursor:pointer;color:var(--text);display:flex;">${ICONS.minus}</span>
        <input type="text" value="${item.qty}" data-qty-input="${p.id}" style="width:28px;text-align:center;border:none;background:transparent;padding:0;font-weight:600;"/>
        <span data-qty-plus="${p.id}" style="cursor:pointer;color:var(--text);display:flex;">${ICONS.plus}</span>
      </div>
      <input type="text" value="$ ${unitPrice.toLocaleString('es-MX')}" data-price-input="${p.id}" style="flex:1;text-align:right;font-weight:700;"/>
    </div>
    <div style="font-size:12px;color:var(--text);font-weight:600;margin-top:8px;">Precio por ${item.qty} unidad${item.qty===1?'':'es'}: ${money(subtotal)}</div>
  </div>`;
}

function escapeAttr(s){
  return String(s).replace(/"/g,'&quot;');
}

function addToCart(productId){
  const p = state.products.find(x=>x.id===productId);
  if(!p) return;
  const existing = state.cart.find(i=>i.productId===productId);
  if(existing){ existing.qty += 1; } else { state.cart.push({productId, qty:1}); }
  persist(); render();
}

function changeQty(productId, delta){
  const item = state.cart.find(i=>i.productId===productId);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0){ state.cart = state.cart.filter(i=>i.productId!==productId); }
  persist(); render();
}

function setQty(productId, qty, isLive){
  const item = state.cart.find(i=>i.productId===productId);
  if(!item) return;
  if(isLive){
    // allow transient 0 while typing (e.g. clearing the field)
    item.qty = Math.max(0, qty);
  } else {
    item.qty = Math.max(1, qty);
  }
  persist(); render();
}

function setLinePrice(productId, rawValue){
  const item = state.cart.find(i=>i.productId===productId);
  if(!item) return;
  const cleaned = String(rawValue).replace(/[^0-9.]/g,'');
  const price = Math.max(0, Number(cleaned)||0);
  item.price = price;
  persist(); render();
}

function removeFromCart(productId){
  state.cart = state.cart.filter(i=>i.productId!==productId);
  persist(); render();
}

function computeCartFinalTotal(){
  const total = state.cart.reduce((sum,item)=>{
    const p = state.products.find(x=>x.id===item.productId);
    const unitPrice = item.price!=null ? item.price : (p?p.price:0);
    return sum + unitPrice*item.qty;
  },0);
  const discountAmount = Math.round((total * (paymentData.discountPct||0) / 100) * 100) / 100;
  return total - discountAmount;
}

let __ticketTemplateImg = null;
function loadTicketTemplateImage(){
  return new Promise((resolve, reject)=>{
    if(__ticketTemplateImg){ resolve(__ticketTemplateImg); return; }
    const img = new Image();
    img.onload = ()=>{ __ticketTemplateImg = img; resolve(img); };
    img.onerror = reject;
    img.src = TICKET_TEMPLATE_SRC;
  });
}

function formatDateDMY(isoDate){
  const [y,m,d] = (isoDate||todayISO()).split('-');
  return `${d}/${m}/${y}`;
}
function formatHora(ts){
  const d = new Date(ts||Date.now());
  let h = d.getHours();
  const m = String(d.getMinutes()).padStart(2,'0');
  const ampm = h>=12 ? 'PM' : 'AM';
  h = h % 12; if(h===0) h=12;
  return `${h}:${m} ${ampm}`;
}
function numFmt(n){
  return Number(n||0).toLocaleString('es-MX', {minimumFractionDigits: (n%1===0?0:2), maximumFractionDigits:2});
}

async function drawTicketToCanvas(sale){
  const img = await loadTicketTemplateImage();
  const canvas = document.createElement('canvas');
  canvas.width = img.width;
  canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);

  const NAVY = '#0B2A45';
  const TEAL = '#049184';

  // Folio / fecha / hora (columna derecha) — primero tapamos el texto de ejemplo de la plantilla
  ctx.fillStyle = '#FFFFFF';
  ctx.fillRect(622, 403, 195, 118);
  ctx.fillStyle = NAVY;
  ctx.textAlign = 'right';
  ctx.font = '600 22px Arial, sans-serif';
  ctx.fillText(sale.folio || '000000', 800, 430);
  ctx.fillText(formatDateDMY(sale.date), 800, 468);
  ctx.fillText(formatHora(sale.timestamp), 800, 506);

  // Filas de productos
  ctx.textAlign = 'left';
  const rowStart = 694, rowSpacing = 58, maxRows = 9;
  const items = sale.items.slice(0, maxRows);
  items.forEach((it,i)=>{
    const y = rowStart + i*rowSpacing;
    ctx.font = '600 20px Arial, sans-serif';
    ctx.fillText(String(it.qty), 60, y);

    let desc = it.name;
    ctx.font = '20px Arial, sans-serif';
    while(ctx.measureText(desc).width > 340 && desc.length > 3){ desc = desc.slice(0, -1); }
    if(desc.length < it.name.length) desc = desc.slice(0, -1) + '…';
    ctx.fillText(desc, 125, y);

    ctx.font = '20px Arial, sans-serif';
    ctx.fillText(numFmt(it.price), 548, y);
    ctx.fillText(numFmt(it.price*it.qty), 728, y);
  });
  if(sale.items.length > maxRows){
    ctx.font = 'italic 16px Arial, sans-serif';
    ctx.fillStyle = TEAL;
    ctx.fillText('+' + (sale.items.length-maxRows) + ' artículo(s) más', 125, rowStart + maxRows*rowSpacing);
  }

  // Subtotal / descuento / total
  const subtotal = sale.items.reduce((s,it)=>s+it.price*it.qty, 0);
  const discount = Math.max(0, subtotal - sale.total);
  ctx.textAlign = 'left';
  ctx.fillStyle = NAVY;
  ctx.font = '600 22px Arial, sans-serif';
  ctx.fillText(numFmt(subtotal), 716, 1253);
  ctx.fillText(numFmt(discount), 716, 1304);
  ctx.fillStyle = TEAL;
  ctx.font = '700 26px Arial, sans-serif';
  ctx.fillText(numFmt(sale.total), 716, 1361);

  return canvas;
}

function canvasToBlob(canvas){
  return new Promise(resolve=>canvas.toBlob(resolve, 'image/png'));
}

async function downloadTicketImage(saleId){
  const sale = state.sales.find(s=>s.id===saleId);
  if(!sale) return;
  try{
    const canvas = await drawTicketToCanvas(sale);
    const blob = await canvasToBlob(canvas);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'ticket-' + (sale.folio||sale.id) + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    showToast('No se pudo generar el ticket');
  }
}

function isMobileDevice(){
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

async function shareTicketImageWhatsApp(saleId){
  const sale = state.sales.find(s=>s.id===saleId);
  if(!sale) return;
  if(isMobileDevice()){
    try{
      const canvas = await drawTicketToCanvas(sale);
      const blob = await canvasToBlob(canvas);
      const file = new File([blob], 'ticket-'+(sale.folio||sale.id)+'.png', {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'Ticket MEDSUM', text:'Aquí tienes tu ticket de compra 💙'});
        return;
      }
    }catch(e){
      // el usuario canceló el menú de compartir a propósito: no seguimos con el respaldo
      if(e && e.name === 'AbortError') return;
    }
  }
  // Computadora (o celular sin soporte para compartir archivos): descarga la imagen
  // y abre WhatsApp con el texto ya listo, para adjuntarla manualmente en el chat
  await downloadTicketImage(saleId);
  if(sale.clientPhone){
    showToast('Ticket descargado. Adjúntalo en el chat de WhatsApp que se abrió');
    sendTicketWhatsApp(saleId);
  } else {
    showToast('Ticket descargado');
  }
}

function buildTicketWhatsAppText(sale){
  const lines = [];
  lines.push('🧾 *MEDSUM Tienda Médica*');
  lines.push('Comprobante de tu compra');
  lines.push('');
  sale.items.forEach(it=>{
    lines.push(`• ${it.qty} x ${it.name} — ${money(it.price*it.qty)}`);
  });
  lines.push('');
  lines.push('*Total: ' + money(sale.total) + '*');
  lines.push('Pago: ' + sale.paymentMethod);
  lines.push('');
  lines.push('¡Gracias por tu compra! 💙');
  return lines.join('\n');
}

function sendTicketWhatsApp(saleId){
  const sale = state.sales.find(s=>s.id===saleId);
  if(!sale){ return; }
  if(!sale.clientPhone){ showToast('Este cliente no tiene teléfono registrado'); return; }
  const digits = formatPhoneForWhatsApp(sale.clientPhone);
  if(digits.length<10){ showToast('Número telefónico incompleto'); return; }
  const text = buildTicketWhatsAppText(sale);
  const url = 'https://api.whatsapp.com/send?phone='+digits+'&text='+encodeURIComponent(text);
  window.open(url, '_blank');
}

function getPreviousPeriodKey(period, refDate){
  const d = new Date(refDate+'T00:00:00');
  const deltas = {Diario:1, Semanal:7, Quincenal:15, Mensual:30};
  d.setDate(d.getDate() - (deltas[period]||1));
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return getPeriodKey(`${y}-${m}-${day}`, period);
}

function buildBalanceReportHTML(){
  const period = balancePeriod;
  const refKey = getPeriodKey(balanceRefDate, period);
  const prevKey = getPreviousPeriodKey(period, balanceRefDate);

  const salesInRange = state.sales.filter(s=>getPeriodKey(s.date, period)===refKey);
  const expensesInRange = state.expenses.filter(e=>getPeriodKey(e.date, period)===refKey);
  const salesPrev = state.sales.filter(s=>getPeriodKey(s.date, period)===prevKey);
  const expensesPrev = state.expenses.filter(e=>getPeriodKey(e.date, period)===prevKey);

  const costOf = (sale)=> sale.items.reduce((s,it)=>{
    const p = state.products.find(x=>x.id===it.productId);
    return s + (p?p.cost:0)*it.qty;
  },0);

  const ingresos = salesInRange.reduce((s,x)=>s+x.total,0);
  const egresos = expensesInRange.reduce((s,x)=>s+x.amount,0);
  const costoVentas = salesInRange.reduce((s,x)=>s+costOf(x),0);
  const gananciaBruta = ingresos - costoVentas;
  const gananciaNeta = gananciaBruta - egresos;
  const balanceNeto = ingresos - egresos;

  const ingresosPrev = salesPrev.reduce((s,x)=>s+x.total,0);
  const egresosPrev = expensesPrev.reduce((s,x)=>s+x.amount,0);
  const gananciaPrev = salesPrev.reduce((s,x)=>s+x.total-costOf(x),0) - egresosPrev;

  const pctChange = (curr, prev)=> prev>0 ? Math.round(((curr-prev)/prev)*1000)/10 : (curr>0?100:0);

      <div class="metrics">

        <div class="metric ${s.gananciaCategoria>=0?'pos':'neg'}"><div class="l">Ganancia</div><div class="v">${money(s.gananciaCategoria)}</div></div>

function buildInventoryReportHTML(){

    .metric .l{font-size:10px;color:#5D7E96;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;}
    .metric .v{font-size:17px;font-weight:800;margin-top:4px;}
    .metric.pos .v{color:#049184;} .metric.warn .v{color:#B7791F;} .metric.neg .v{color:#E5484D;}
    h2.sec{font-size:13px;margin:22px 0 8px;color:#0B2A45;}
  </style></head>
  <body>
    <div class="page">
      ${formalLetterhead(logoTag)}
      ${formalInfoRow([
        ['REPORTE', 'Inventario'],
        ['FILTRO', filterDesc],
        ['GENERADO', formatDateDMY(todayISO())],

      <div class="metrics">
        <div class="metric"><div class="l">Referencias</div><div class="v">${totalSkus}</div></div>

function openFormalDocument(html){
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.target = '_blank'; a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

function wrapCanvasText(ctx, text, maxWidth){
  const words = text.split(' ');
  const lines = [];
  let line = '';
  words.forEach(w=>{
    const test = line ? line+' '+w : w;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else { line = test; }
  });
  if(line) lines.push(line);
  return lines;
}

function drawDashedLine(ctx, x1, y, x2){
  ctx.save();
  ctx.strokeStyle = '#C7D2D9';
  ctx.lineWidth = 2;
  ctx.setLineDash([6,5]);
  ctx.beginPath();
  ctx.moveTo(x1,y); ctx.lineTo(x2,y);
  ctx.stroke();
  ctx.restore();
}

async function buildFormalReceiptCanvas(sale){
  const W = 760;
  const rowH = 34;
  const itemsHeight = sale.items.length * rowH;
  const H = 760 + itemsHeight;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const NAVY = '#0B2A45', TEAL = '#049184', GRAY = '#5D7E96', LIGHTBG = '#F4F7F9';

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,W,H);

  let y = 44;
  // Logo
  try{
    const logoImg = new Image();
    await new Promise((res,rej)=>{ logoImg.onload=res; logoImg.onerror=rej; logoImg.src = MEDSUM_LOGO_SRC; });
    ctx.drawImage(logoImg, W/2-32, y, 64, 64);
  }catch(e){}
  y += 78;
  ctx.textAlign = 'center';
  ctx.fillStyle = NAVY;
  ctx.font = '800 24px Arial, sans-serif';
  ctx.fillText('MEDSUM', W/2, y);
  y += 18;
  ctx.fillStyle = GRAY;
  ctx.font = '700 10px Arial, sans-serif';
  ctx.fillText('FARMACIA · TIENDA MÉDICA · MINISÚPER', W/2, y);
  y += 16;
  ctx.fillStyle = TEAL;
  ctx.font = '800 10px Arial, sans-serif';
  ctx.fillText('SALUD QUE TRANSFORMA', W/2, y);
  y += 18;
  drawDashedLine(ctx, 44, y, W-44);
  y += 32;

  // Contacto (izq) / meta (der)
  ctx.textAlign = 'left';
  ctx.fillStyle = NAVY;
  ctx.font = '12px Arial, sans-serif';
  ctx.fillText('📍 ' + MEDSUM_CONTACT.address1 + ', ' + MEDSUM_CONTACT.address2, 44, y);
  ctx.fillText('📞 ' + MEDSUM_CONTACT.phone, 44, y+22);
  ctx.fillText('📷 ' + MEDSUM_CONTACT.instagram, 44, y+44);

  const metaRows = [
    ['FOLIO', sale.folio || sale.id.slice(-6).toUpperCase()],
    ['FECHA', formatDateDMY(sale.date)],
    ['HORA', formatHora(sale.timestamp)],
    ['CLIENTE', sale.clientName || 'Público en general']
  ];
  ctx.textAlign = 'right';
  metaRows.forEach((r,i)=>{
    const ry = y + i*22 - 3;
    ctx.font = '800 12px Arial, sans-serif';
    ctx.fillStyle = NAVY;
    let label = r[0]+': ';
    ctx.font = '600 12px Arial, sans-serif';
    ctx.fillStyle = '#16263A';
    ctx.fillText(r[1], W-44, ry);
    const valW = ctx.measureText(r[1]).width;
    ctx.font = '800 12px Arial, sans-serif';
    ctx.fillStyle = NAVY;
    ctx.fillText(label, W-44-valW-4, ry);
  });
  y += 62;
  drawDashedLine(ctx, 44, y, W-44);
  y += 8;

  // Tabla
  ctx.fillStyle = NAVY;
  ctx.fillRect(44, y, W-88, 30);
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 10px Arial, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('CANT.', 54, y+19);
  ctx.fillText('DESCRIPCIÓN', 120, y+19);
  ctx.textAlign = 'right';
  ctx.fillText('PRECIO UNIT.', W-210, y+19);
  ctx.fillText('IMPORTE', W-54, y+19);
  y += 30;

  sale.items.forEach((it,i)=>{
    const ry = y + i*rowH;
    if(i%2===1){ ctx.fillStyle = '#FAFCFD'; ctx.fillRect(44, ry, W-88, rowH); }
    ctx.fillStyle = '#16263A';
    ctx.font = '12px Arial, sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(String(it.qty), 54, ry+21);
    let desc = it.name;
    ctx.font = '12px Arial, sans-serif';
    while(ctx.measureText(desc).width > 300 && desc.length>3){ desc = desc.slice(0,-1); }
    if(desc.length < it.name.length) desc = desc.slice(0,-1)+'…';
    ctx.fillText(desc, 120, ry+21);
    ctx.textAlign = 'right';
    ctx.fillText(money(it.price), W-210, ry+21);
    ctx.fillText(money(it.price*it.qty), W-54, ry+21);
  });
  y += itemsHeight;
  ctx.strokeStyle = '#E3E9ED'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(44,y); ctx.lineTo(W-44,y); ctx.stroke();
  y += 30;

  // Totales
  const subtotal = sale.items.reduce((s,it)=>s+it.price*it.qty,0);
  const discount = Math.max(0, subtotal - sale.total);
  const {base, iva} = ivaBreakdown(sale.total);
  const totalRows = [];
  if(discount>0){
    totalRows.push(['Suma de productos', money(subtotal), false]);
    totalRows.push(['DESCUENTO', '-'+money(discount), false]);
  }
  totalRows.push(['SUBTOTAL', money(base), false]);
  totalRows.push(['IVA (16%)', money(iva), false]);
  totalRows.push(['TOTAL', money(sale.total), true]);

  totalRows.forEach((r,i)=>{
    const ry = y + i*30;
    ctx.textAlign = 'right';
    ctx.fillStyle = r[2] ? TEAL : GRAY;
    ctx.font = r[2] ? '800 15px Arial, sans-serif' : '600 12px Arial, sans-serif';
    ctx.fillText(r[0]+':', W-220, ry);
    ctx.font = r[2] ? '800 16px Arial, sans-serif' : '700 12px Arial, sans-serif';
    ctx.fillText(r[1], W-54, ry);
  });
  y += totalRows.length*30 + 20;

  // Notas
  ctx.fillStyle = LIGHTBG;
  const notesText = 'Este documento es un comprobante de compra (' + (sale.paymentMethod||'-') + ' · ' + (sale.paymentType||'Pagada') + '). Para cambios y devoluciones, presenta este recibo dentro de los siguientes 5 días hábiles junto con el producto en su empaque original.';
  ctx.font = '10.5px Arial, sans-serif';
  const noteLines = wrapCanvasText(ctx, notesText, W-100);
  const notesBoxH = noteLines.length*16 + 24;
  ctx.fillRect(44, y, W-88, notesBoxH);
  ctx.fillStyle = GRAY;
  ctx.textAlign = 'left';
  noteLines.forEach((line,i)=>ctx.fillText(line, 60, y+22+i*16));
  y += notesBoxH + 34;

  // Agradecimiento
  ctx.textAlign = 'center';
  ctx.font = '800 18px Arial, sans-serif';
  ctx.fillStyle = NAVY;
  ctx.fillText('¡GRACIAS POR SU COMPRA!', W/2, y);
  y += 30;
  ctx.font = '800 11px Arial, sans-serif';
  const pillText = 'VUELVA PRONTO ♥';
  const pillW = ctx.measureText(pillText).width + 40;
  ctx.fillStyle = TEAL;
  ctx.beginPath();
  ctx.roundRect(W/2-pillW/2, y-14, pillW, 28, 14);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.fillText(pillText, W/2, y+5);
  y += 40;

  // Footer
  ctx.fillStyle = NAVY;
  ctx.fillRect(0, y, W, 44);
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 11px Arial, sans-serif';
  ctx.fillText('•  •  •   SALUD QUE TRANSFORMA   •  •  •', W/2, y+27);

  return canvas;
}

async function downloadFormalDocumentImage(sale, filename){
  try{
    const canvas = await buildFormalReceiptCanvas(sale);
    canvas.toBlob(blob=>{
      if(!blob){ showToast('No se pudo generar la imagen'); return; }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
    }, 'image/png');
  }catch(e){
    showToast('No se pudo generar la imagen, intenta de nuevo');
  }
}

function ivaBreakdown(finalAmount){
  const base = Math.round((finalAmount / 1.16) * 100) / 100;
  const iva = Math.round((finalAmount - base) * 100) / 100;
  return {base, iva};
}

function checkout(){
  if(!state.cart.length) return;
  const total = state.cart.reduce((sum,item)=>{
    const p = state.products.find(x=>x.id===item.productId);
    const unitPrice = item.price!=null ? item.price : (p?p.price:0);
    return sum + unitPrice*item.qty;
  },0);
  const discountAmount = Math.round((total * (paymentData.discountPct||0) / 100) * 100) / 100;
  const finalTotal = total - discountAmount;

  // Validar que los pagos divididos sumen el total antes de continuar (solo aplica si hay más de un pago)
  if(paymentData.splits.length > 1){
    const splitsSum = paymentData.splits.reduce((s,x)=>s+(Number(x.amount)||0),0);
    if(Math.abs(finalTotal - splitsSum) >= 0.01){
      showToast('Los pagos no suman el total de la venta');
      return;
    }
  } else {
    paymentData.splits[0].amount = finalTotal;
  }
  const uniqueMethods = [...new Set(paymentData.splits.map(s=>s.method))];
  const paymentMethodSummary = paymentData.splits.length<=1
    ? paymentData.splits[0].method
    : paymentData.splits.map(s=>`${s.method} (${money(s.amount)})`).join(' + ');

  const client = state.clients.find(c=>c.id===paymentData.clientId);
  const items = state.cart.map(item=>{
    const p = state.products.find(x=>x.id===item.productId);
    const unitPrice = item.price!=null ? item.price : p.price;
    p.stock = Math.max(0, p.stock - item.qty);
    return {productId:item.productId, name:p.name, qty:item.qty, price:unitPrice};
  });
  const saleId = uid('sale');
  const itemsText = items.map(it=>`${it.qty} ${it.name}`).join(', ');
  const folio = String(state.sales.length + 1).padStart(6, '0');
  state.sales.push({id:saleId, date:todayISO(), timestamp:Date.now(), folio, items, total:finalTotal, paymentMethod: paymentMethodSummary, paymentSplits: paymentData.splits.map(s=>({amount:s.amount, method:s.method})), paymentType: paymentData.type, clientName: client?client.name:'Público en general', clientId: client?client.id:null, clientPhone: client?client.phone:'', name:''});

  let loyaltyMsg = '';
  if(client){
    if(paymentData.appliedCouponId){
      const cp = client.coupons.find(k=>k.id===paymentData.appliedCouponId);
      if(cp && !cp.redeemed){
        cp.redeemed = true;
        client.history = client.history || [];
        client.history.unshift({type:'coupon_redeemed', date:Date.now(), description:'Cupón usado: '+cp.code});
      }
    }
    const newCouponsFromPurchase = registerPurchase(client, finalTotal);
    const newCouponFromVisit = registerVisit(client);
    const generated = newCouponsFromPurchase.length + (newCouponFromVisit?1:0);
    if(generated>0) loyaltyMsg = ` · ¡${generated} cupón${generated>1?'es':''} nuevo${generated>1?'s':''} para ${client.name}!`;
  }

  state.cart = [];
  paymentData.appliedCouponId = null;
  paymentData.discountPct = 0;
  paymentData.clientId = null;
  paymentData.numPayments = 1;
  paymentData.method = 'Efectivo';
  paymentData.splits = [{amount:null, method:'Efectivo'}];
  venderStep = 'cart';
  lastSaleId = saleId;
  saleNameInput = itemsText;
  saleSuccessOpen = true;
  persist();
  render();
  if(loyaltyMsg) showToast('Venta registrada' + loyaltyMsg);
}

let balanceTab = 'ingresos';

let balanceRefDate = todayISO();

function shiftBalanceDate(dir){
  const d = new Date(balanceRefDate+'T00:00:00');
  const deltas = {Diario:1, Semanal:7, Quincenal:15, Mensual:30};
  d.setDate(d.getDate() + dir*(deltas[balancePeriod]||1));
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  balanceRefDate = `${y}-${m}-${day}`;
}

function balanceRangeLabel(){
  const d = new Date(balanceRefDate+'T00:00:00');
  const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  if(balancePeriod==='Diario') return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
  if(balancePeriod==='Semanal'){
    const start = new Date(d); start.setDate(d.getDate()-d.getDay());
    const end = new Date(start); end.setDate(start.getDate()+6);
    return `${start.getDate()} - ${end.getDate()} ${months[end.getMonth()]}`;
  }
  if(balancePeriod==='Quincenal'){
    return d.getDate()<=15 ? `01 - 15 ${months[d.getMonth()]}` : `16 - ${new Date(d.getFullYear(),d.getMonth()+1,0).getDate()} ${months[d.getMonth()]}`;
  }
  return `${months[d.getMonth()]} ${d.getFullYear()}`;
}

function renderBalance(){
  const refKey = getPeriodKey(balanceRefDate, balancePeriod);
  const salesToday = state.sales.filter(s=>getPeriodKey(s.date, balancePeriod)===refKey);
  const expensesToday = state.expenses.filter(e=>getPeriodKey(e.date, balancePeriod)===refKey);
  const ventasTotales = salesToday.reduce((s,x)=>s+x.total,0);
  const gastosTotales = expensesToday.reduce((s,x)=>s+x.amount,0);
  const balance = ventasTotales - gastosTotales;
  const hasData = salesToday.length > 0 || expensesToday.length > 0;

  const tabs = [
    {id:'ingresos', label:'Ingresos'},
    {id:'egresos', label:'Egresos'},
    {id:'porcobrar', label:'Por cobrar'},
    {id:'porpagar', label:'Por pagar'},

  let tabContent = '';
  if(balanceMainTab==='cierres'){
    tabContent = `<div class="empty-state">${ICONS.balance}<b>No hay cierres de caja registrados</b></div>`;
  } else if(balanceTab==='ingresos'){
    tabContent = salesToday.length ? `

      <tbody>${salesToday.map(s=>`<tr><td>${s.date}</td><td>${s.items.map(i=>i.name+' x'+i.qty).join(', ')}</td><td>${money(s.total)}</td><td><span data-view-sale="${s.id}" style="color:var(--turquoise-dark);font-weight:700;cursor:pointer;font-size:12.5px;white-space:nowrap;">👁 Ver ›</span></td></tr>`).join('')}</tbody></table>

    tabContent = expensesToday.length ? `
      <table><thead><tr><th>Fecha</th><th>Concepto</th><th>Monto</th><th></th></tr></thead>
      <tbody>${expensesToday.map(e=>`<tr><td>${e.date}</td><td>${e.concept}</td><td style="color:var(--danger);">-${money(e.amount)}</td><td><span data-view-expense="${e.id}" style="color:var(--turquoise-dark);font-weight:700;cursor:pointer;font-size:12.5px;white-space:nowrap;">👁 Ver ›</span></td></tr>`).join('')}</tbody></table>

function TrendCard(title, value, pct, periodWord){
  const positive = pct >= 0;
  const bg = positive ? '#D7F4E8' : '#FDEAEB';
  const color = positive ? '#0A5C3A' : '#B4232A';
  const arrow = positive ? '▲' : '▼';
  return `
  <div class="card" style="flex:1;min-width:220px;padding:18px;">
    <div style="font-size:12px;color:var(--text-muted);font-weight:600;">${title}</div>
    <div style="display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap;">
      <div style="font-size:22px;font-weight:700;">${money(value)}</div>
      <span style="display:inline-flex;align-items:center;gap:4px;background:${bg};color:${color};padding:3px 9px;border-radius:10px;font-size:11.5px;font-weight:700;">${arrow} ${pct>=0?'+':''}${pct}%</span>
    </div>
    <div style="font-size:12px;color:var(--text-muted);margin-top:8px;">Comparado con el ${periodWord} anterior</div>
  </div>`;
}

function labelForKey(key, period){
  if(period==='Mensual'){
    const [y,m] = key.split('-');
    return MONTH_NAMES[Number(m)];
  }
  if(period==='Quincenal'){
    const parts = key.split('-');
    return parts[2] + ' ' + MONTH_NAMES[Number(parts[1])];
  }
  if(period==='Semanal'){
    return 'Sem. ' + key.split('-S')[1];
  }
  return key; // Diario
}

let estadisticasPeriod = 'Mensual';
let estadisticasCategory = '';

function getPeriodKey(dateStr, period){
  const d = new Date(dateStr+'T00:00:00');
  if(period==='Diario') return dateStr;
  if(period==='Semanal'){
    const onejan = new Date(d.getFullYear(),0,1);
    const week = Math.ceil((((d - onejan) / 86400000) + onejan.getDay()+1)/7);
    return d.getFullYear()+'-S'+week;
  }
  if(period==='Quincenal'){
    return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+(d.getDate()<=15?'Q1':'Q2');
  }
  return d.getFullYear()+'-'+(d.getMonth()+1); // Mensual
}
function periodLabel(period){
  return {Diario:'día', Semanal:'semana', Quincenal:'quincena', Mensual:'mes'}[period] || 'periodo';
}
const MONTH_NAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function periodDaysApprox(period){
  return {Diario:1, Semanal:7, Quincenal:15, Mensual:30}[period] || 30;
}

function computeCategoryStats(category, period, refDateISO){
  const refKey = getPeriodKey(refDateISO, period);
  const salesInRange = state.sales.filter(s=>getPeriodKey(s.date, period)===refKey);

  const productMap = {};
  let ventasCategoria = 0, costoCategoria = 0, unidadesVendidas = 0, numTransacciones = 0;

  salesInRange.forEach(sale=>{
    let saleTouchesCategory = false;
    sale.items.forEach(it=>{
      const p = state.products.find(x=>x.id===it.productId);
      if(!p || p.category!==category) return;
      saleTouchesCategory = true;
      const cost = p.cost||0;
      const revenue = it.price*it.qty;
      const costTotal = cost*it.qty;
      ventasCategoria += revenue;
      costoCategoria += costTotal;
      unidadesVendidas += it.qty;
      if(!productMap[it.productId]) productMap[it.productId] = {name:it.name, qty:0, revenue:0, cost:0, stock:p.stock, price:p.price};
      productMap[it.productId].qty += it.qty;
      productMap[it.productId].revenue += revenue;
      productMap[it.productId].cost += costTotal;
    });
    if(saleTouchesCategory) numTransacciones++;
  });

  const gananciaCategoria = ventasCategoria - costoCategoria;
  const margenPct = ventasCategoria>0 ? Math.round((gananciaCategoria/ventasCategoria)*1000)/10 : 0;
  const ticketPromedio = numTransacciones>0 ? ventasCategoria/numTransacciones : 0;
  const days = periodDaysApprox(period);

  const products = Object.values(productMap).map(p=>({
    ...p,
    margenPct: p.revenue>0 ? Math.round(((p.revenue-p.cost)/p.revenue)*1000)/10 : 0,
    velocidadDiaria: p.qty/days,
    diasInventario: p.qty>0 ? Math.round((p.stock / (p.qty/days))*10)/10 : null,
  })).sort((a,b)=>b.revenue-a.revenue);

  // Productos de la categoría que no tuvieron ninguna venta en el periodo (para detectar rotación lenta)
  const soldIds = new Set(Object.keys(productMap));
  const noMovimiento = state.products.filter(p=>p.category===category && !soldIds.has(p.id));

  return {
    category, ventasCategoria, costoCategoria, gananciaCategoria, margenPct,
    unidadesVendidas, numTransacciones, ticketPromedio, products, noMovimiento, days
  };
}

function renderEstadisticas(){
  const today = new Date();

  // Agrupar ventas por periodo
  const byPeriod = {};
  state.sales.forEach(s=>{
    const key = getPeriodKey(s.date, estadisticasPeriod);
    byPeriod[key] = (byPeriod[key]||0) + s.total;
  });
  const sortedKeys = Object.keys(byPeriod).sort();
  const currentKey = getPeriodKey(todayISO(), estadisticasPeriod);
  const currentTotal = byPeriod[currentKey] || 0;
  // periodo anterior: el key inmediatamente antes del actual entre los existentes, o 0 si no hay
  const priorKeys = sortedKeys.filter(k=>k!==currentKey && k<currentKey);
  const previousKey = priorKeys.length ? priorKeys[priorKeys.length-1] : null;
  const previousTotal = previousKey ? byPeriod[previousKey] : 0;

  const totalVentas = currentTotal;
  const gananciaTotal = state.sales.filter(s=>getPeriodKey(s.date, estadisticasPeriod)===currentKey).reduce((sum,sale)=>{
    return sum + sale.items.reduce((s2,it)=>{
      const p = state.products.find(x=>x.id===it.productId);
      const cost = p ? p.cost : 0;
      return s2 + (it.price-cost)*it.qty;
    },0);
  },0);
  const prevGanancia = state.sales.filter(s=>previousKey && getPeriodKey(s.date, estadisticasPeriod)===previousKey).reduce((sum,sale)=>{
    return sum + sale.items.reduce((s2,it)=>{
      const p = state.products.find(x=>x.id===it.productId);
      const cost = p ? p.cost : 0;
      return s2 + (it.price-cost)*it.qty;
    },0);
  },0);
  const pctChange = (curr, prev) => prev>0 ? Math.round(((curr-prev)/prev)*1000)/10 : (curr>0?100:0);
  const ventasPct = pctChange(totalVentas, previousTotal);
  const gananciaPct = pctChange(gananciaTotal, prevGanancia);

  const rangeLabel = (()=>{
    const y = today.getFullYear(), m = today.getMonth(), d = today.getDate();
    if(estadisticasPeriod==='Mensual'){
      const lastDay = new Date(y, m+1, 0).getDate();
      return `01 - ${lastDay} ${MONTH_NAMES[m]}`;
    }
    if(estadisticasPeriod==='Quincenal'){
      return d<=15 ? `01 - 15 ${MONTH_NAMES[m]}` : `16 - ${new Date(y,m+1,0).getDate()} ${MONTH_NAMES[m]}`;
    }
    if(estadisticasPeriod==='Semanal'){
      const start = new Date(today); start.setDate(d - today.getDay());
      const end = new Date(start); end.setDate(start.getDate()+6);
      return `${start.getDate()} - ${end.getDate()} ${MONTH_NAMES[end.getMonth()]}`;
    }
    return `${d} ${MONTH_NAMES[m]}`;
  })();

  const productStats = {};
  state.sales.filter(s=>getPeriodKey(s.date, estadisticasPeriod)===currentKey).forEach(sale=>{
    sale.items.forEach(it=>{
      if(!productStats[it.productId]) productStats[it.productId] = {name:it.name, totalVentas:0, totalQty:0};
      productStats[it.productId].totalVentas += it.price*it.qty;
      productStats[it.productId].totalQty += it.qty;
    });
  });
  const productRows = Object.values(productStats).sort((a,b)=>b.totalVentas-a.totalVentas);

  const prevLabel = previousKey ? labelForKey(previousKey, estadisticasPeriod) : 'Anterior';
  const currLabel = labelForKey(currentKey, estadisticasPeriod);
  const chartMax = Math.max(1, previousTotal, currentTotal);

  return `
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
    <select id="estadisticas-period" style="min-width:140px;">
      ${['Diario','Semanal','Quincenal','Mensual'].map(p=>`<option value="${p}" ${estadisticasPeriod===p?'selected':''}>${p}</option>`).join('')}
    </select>
    <div style="font-size:13px;color:var(--text-muted);font-weight:600;">📅 ${rangeLabel}</div>
  </div>
  <div style="display:flex;gap:16px;margin-bottom:18px;flex-wrap:wrap;">
    ${TrendCard('Total ventas', totalVentas, ventasPct, periodLabel(estadisticasPeriod))}
    ${TrendCard('Ganancia de las ventas', gananciaTotal, gananciaPct, periodLabel(estadisticasPeriod))}
  </div>
  <div class="card" style="padding:20px;margin-bottom:18px;">
    <b style="font-size:14px;">Detalle de ventas</b>
    <div style="display:flex;gap:16px;align-items:center;margin:14px 0 18px;">
      <div style="display:flex;align-items:center;gap:6px;"><span style="width:14px;height:14px;border-radius:3px;background:#D7F4E8;display:inline-block;"></span><span style="font-size:12.5px;color:var(--text-muted);">${prevLabel}</span></div>
      <div style="display:flex;align-items:center;gap:6px;"><span style="width:14px;height:14px;border-radius:3px;background:#10935C;display:inline-block;"></span><span style="font-size:12.5px;color:var(--text-muted);">${currLabel}</span></div>
    </div>
    ${(previousTotal>0 || currentTotal>0) ? `
      <div style="display:flex;align-items:flex-end;gap:28px;height:200px;padding:0 20px;">
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;">
          <span style="font-size:12.5px;font-weight:700;color:var(--text-muted);">${money(previousTotal)}</span>
          <div style="width:70%;background:#D7F4E8;border-radius:10px 6px 0 0;height:${Math.max(4,(previousTotal/chartMax)*100)}%;"></div>
          <span style="font-size:11px;color:var(--text-muted);">${prevLabel}</span>
        </div>
        <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end;">
          <span style="font-size:12.5px;font-weight:700;color:#0A5C3A;">${money(currentTotal)}</span>
          <div style="width:70%;background:#10935C;border-radius:10px 6px 0 0;height:${Math.max(4,(currentTotal/chartMax)*100)}%;"></div>
          <span style="font-size:11px;color:var(--text-muted);">${currLabel}</span>
        </div>
      </div>
    ` : `<div class="empty-state">${ICONS.estadisticas}<b>Aún no hay ventas registradas</b><span>Registra una venta para ver tus estadísticas</span></div>`}
  </div>
  <div class="card" style="overflow-x:auto;">
    <div style="padding:16px 20px 0;"><b style="font-size:14px;">Detalle de productos vendidos</b></div>
    <table style="margin-top:10px;">
      <thead><tr><th>Producto</th><th>Total ventas</th><th>Total de productos vendidos</th></tr></thead>
      <tbody>
        ${productRows.length ? productRows.map((p,i)=>`
          <tr>
            <td style="font-weight:600;">
              <div style="display:flex;align-items:center;gap:8px;">
                <span>${p.name}</span>
                ${i===0 ? `<span style="display:inline-flex;align-items:center;gap:4px;background:#FEE7CD;color:#B7791F;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:700;">🏅 Producto estrella</span>` : ''}
              </div>
            </td>
            <td>${money(p.totalVentas)}</td><td>${p.totalQty}</td></tr>
        `).join('') : `<tr><td colspan="3"><div class="empty-state">${ICONS.box}<b>Aún no hay productos vendidos</b></div></td></tr>`}
      </tbody>
    </table>
  </div>
  <div class="card" style="padding:20px;margin-top:18px;">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:6px;">
      <b style="font-size:14px;">Análisis por categoría</b>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <select id="estadisticas-category" style="min-width:180px;">
          <option value="">Selecciona una categoría</option>
          ${CATEGORIES.map(c=>`<option value="${c}" ${estadisticasCategory===c?'selected':''}>${c}</option>`).join('')}
        </select>
        ${estadisticasCategory ? `<button class="btn btn-outline btn-sm" data-download-category-report="1">⬇ Descargar reporte</button>` : ''}
      </div>
    </div>
    ${estadisticasCategory ? CategoryStatsBlock(computeCategoryStats(estadisticasCategory, estadisticasPeriod, todayISO())) : `
      <div style="font-size:12.5px;color:var(--text-muted);padding:14px 0 4px;">Elige una categoría (por ejemplo, "Abarrotes") para ver ventas, ganancia, margen y rotación solo de esos productos.</div>
    `}
  </div>`;
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function formatLoyDate(ts){
  if(!ts) return '';
  const d = new Date(ts);
  const months = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return d.getDate()+' '+months[d.getMonth()]+' '+d.getFullYear()+', '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function formatTimeAgo(ts){
  if(!ts) return '';
  const diff = Date.now()-ts;
  const mins = Math.floor(diff/60000), hours=Math.floor(diff/3600000), days=Math.floor(diff/86400000);
  if(mins<1) return 'Ahora';
  if(mins<60) return 'Hace '+mins+' min';
  if(hours<24) return 'Hace '+hours+'h';
  if(days<7) return 'Hace '+days+' día'+(days>1?'s':'');
  return formatLoyDate(ts);
}
function formatPhoneForWhatsApp(phone){
  let digits = (phone||'').replace(/[^0-9]/g,'').replace(/^0+/,'');
  if(digits.length===10) digits='52'+digits;
  else if(digits.length===11 && digits.startsWith('1')) digits='52'+digits.slice(1);
  return digits;
}

function buildSummaryMessage(c){
  const s = state.loyaltySettings;
  const visitasRestantes = s.visitCount - (c.visitCycle||0);

  const isDoc = c.type==='medico';

    : '¡Hola '+c.name+'! 👋 Esperamos que estés teniendo un excelente día. Te compartimos el resumen de tus beneficios en *MEDSUM* 💙:\n\n';
  msg += (isDoc ? '📊 *Su avance actual:*\n' : '📊 *Tu avance actual:*\n');

    msg += '• Visitas: *'+(c.visitCycle||0)+' de '+s.visitCount+'*'+(visitasRestantes>0?' (le resta '+visitasRestantes+' visita'+(visitasRestantes>1?'s':'')+' para obtener su '+s.visitPct+'% OFF)':' (¡Cupón listo!)')+'\n';
    msg += '• Compras acumuladas: *'+money(c.purchaseAccum||0)+' / '+money(s.purchaseThreshold)+'*'+(faltaCompra>0?' (con '+money(faltaCompra)+' adicionales obtiene su '+s.purchasePct+'% OFF)':' (¡Cupón listo!)')+'\n';

  if(activeCoupons.length>0){

function sendWhatsAppToClient(clientId){
  const c = state.clients.find(x=>x.id===clientId);
  if(!c || !c.phone){ showToast('Sin teléfono registrado'); return; }
  const digits = formatPhoneForWhatsApp(c.phone);
  if(digits.length<10){ showToast('Número telefónico incompleto'); return; }
  const isWelcome = registerSuccessClientId===c.id;
  const msgText = isWelcome ? buildWelcomeMessage(c) : buildSummaryMessage(c);
  const url = 'https://api.whatsapp.com/send?phone='+digits+'&text='+encodeURIComponent(msgText);
  window.open(url, '_blank');
}
